<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球板塊構造應力波動與即時地震監測 (Wave粒子版)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #020617; 
            color: #f3f4f6; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            overflow: hidden; 
        }
        #webgl-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .header {
            position: absolute;
            top: 24px;
            left: 28px;
            z-index: 10;
            pointer-events: none;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #38bdf8;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }
        .header p {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }
        .sync-status {
            display: inline-block;
            margin-top: 6px;
            font-size: 11px;
            color: #4ade80;
            background: rgba(34, 197, 94, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .legend-panel {
            position: absolute;
            top: 24px;
            right: 28px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(56, 189, 248, 0.3);
            backdrop-filter: blur(8px);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 12px;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .legend-item:last-child { margin-bottom: 0; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot.real { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
        .dot.predict { background: #eab308; box-shadow: 0 0 8px #eab308; }
        .dot.high-stress { background: #00f0ff; box-shadow: 0 0 8px #00f0ff; }
        .dot.divergent { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }

        #dialog-card {
            position: absolute;
            z-index: 20;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(56, 189, 248, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 16px 20px;
            width: 320px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
            display: none;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .badge-type {
            font-size: 10px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 6px;
        }
        .badge-type.real { background: #ef4444; color: #fff; }
        .badge-type.predict { background: #eab308; color: #0f172a; }

        .card-title { font-size: 15px; font-weight: bold; color: #fff; margin-bottom: 6px; }
        .card-meta { font-size: 12px; color: #38bdf8; margin-bottom: 6px; display: flex; gap: 10px; flex-wrap: wrap; }
        .card-desc { font-size: 11px; color: #cbd5e1; line-height: 1.4; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 6px; }

        .timeline-bar {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 90vw;
            overflow-x: auto;
        }
        .btn-step {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 11px;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .btn-step:hover { background: #38bdf8; color: #0f172a; font-weight: bold; }
        .btn-step.active { background: #f97316; border-color: #f97316; color: #fff; font-weight: bold; }
        .btn-step.predict-btn { border-color: #eab308; color: #eab308; }
        .btn-step.predict-btn.active { background: #eab308; color: #0f172a; }
    </style>
</head>
<body>

    <div class="header">
        <h1>全球板塊構造應力波動與即時地震監測</h1>
        <p>依地殼運動速率密度分級之動態 Wave 應力流光粒子波</p>
        <div class="sync-status" id="sync-status">USGS 即時資料載入中...</div>
    </div>

    <div class="legend-panel">
        <div class="legend-item"><div class="dot real"></div><span>實際發生地震 (USGS即時 / 歷史)</span></div>
        <div class="legend-item"><div class="dot predict"></div><span>科學預測高風險區 (應力累積)</span></div>
        <div class="legend-item"><div class="dot high-stress"></div><span>強擠壓隱沒帶 (高密度快波 8-10cm/yr)</span></div>
        <div class="legend-item"><div class="dot divergent"></div><span>張裂/洋脊擴張帶 (中低密度暖波 2-5cm/yr)</span></div>
    </div>

    <div id="dialog-card">
        <span class="badge-type real" id="c-badge">實際發生</span>
        <div class="card-title" id="c-title">載入中...</div>
        <div class="card-meta">
            <span id="c-date">--</span>
            <span id="c-mag">--</span>
            <span id="c-depth">--</span>
        </div>
        <div class="card-desc" id="c-desc">--</div>
    </div>

    <div class="timeline-bar" id="timeline-controls">
        <button class="btn-step" id="btn-auto">自動導覽</button>
    </div>

    <div id="webgl-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const API_POLL_INTERVAL = 300000; // 5分鐘輪詢一次

        let allEarthquakeData = [
            {
                id: "p1", type: "predict",
                date: "預測視窗：2026 Q3-Q4",
                location: "台灣東部外海 (琉球海溝延續段)",
                lat: 23.8, lng: 122.5,
                mag: "評估 M 7.0+", depth: "15-30 km",
                desc: "菲律賓海板塊持續朝西北向隱沒擠壓歐亞板塊，應力鎖定與形變速率高達 8 cm/yr。"
            },
            {
                id: "p2", type: "predict",
                date: "預測視窗：2026 下半年",
                location: "南美洲 中段隱沒帶 (祕魯/智利交界)",
                lat: -18.5, lng: -70.3,
                mag: "評估 M 7.5+", depth: "35 km",
                desc: "納斯卡板塊東插強烈擠壓南美板塊，歷史特大逆衝破裂長週期窗口逼近。"
            },
            {
                id: "r1", type: "real",
                date: "2026/08/14",
                location: "印尼 弗洛勒斯海",
                lat: -7.60, lng: 121.90,
                mag: "M 7.7", depth: "10 km",
                desc: "弗洛勒斯逆衝帶淺層破裂，澳洲板塊朝巽他板塊隱沒前緣擠壓。"
            },
            {
                id: "r2", type: "real",
                date: "2026/08/10",
                location: "哥倫比亞 喬科省",
                lat: 4.90, lng: -76.60,
                mag: "M 7.4", depth: "110 km",
                desc: "納斯卡板塊俯衝至南美板塊下方的中深層板塊拉張撕裂。"
            },
            {
                id: "r3", type: "real",
                date: "2026/06/07",
                location: "菲律賓 棉蘭老島西南外海",
                lat: 5.92, lng: 124.95,
                mag: "M 7.8", depth: "57 km",
                desc: "哥塔巴托海溝隱沒帶與菲律賓移動帶板塊交界面強烈擠壓。"
            }
        ];

        // 公開地質構造應力邊界與形變速率曲線路徑定義
        const stressFaultZones = [
            // 1. 西太平洋與東亞俯衝帶（高應力密度，8-10 cm/yr）
            {
                name: "西太平洋俯衝帶 (千島-日本-琉球-菲律賓)",
                coords: [[52, 160], [42, 145], [35, 140], [24, 123], [14, 125], [5, 126], [-8, 120]],
                density: 35, speed: 0.0035, color: 0x00f0ff, type: "強逆衝隱沒"
            },
            // 2. 南美安地斯隱沒帶（納斯卡板塊擠壓，7-8 cm/yr）
            {
                name: "南美洲西緣海溝帶",
                coords: [[5, -78], [-10, -78], [-23, -71], [-35, -73], [-48, -75]],
                density: 28, speed: 0.0032, color: 0x00f0ff, type: "強逆衝隱沒"
            },
            // 3. 巽他-爪哇海溝（澳洲板塊北插，6-7 cm/yr）
            {
                name: "巽他-爪哇海溝帶",
                coords: [[10, 93], [0, 98], [-8, 110], [-10, 125], [-5, 140]],
                density: 26, speed: 0.0030, color: 0x38bdf8, type: "斜向擠壓"
            },
            // 4. 大西洋中洋脊擴張帶（張裂波浪，2-4 cm/yr）
            {
                name: "大西洋中洋脊",
                coords: [[65, -18], [40, -30], [15, -42], [-5, -20], [-30, -14], [-55, -5]],
                density: 18, speed: 0.0016, color: 0xf59e0b, type: "洋脊張裂擴張"
            },
            // 5. 南極與斯科舍海邊界帶
            {
                name: "斯科舍海與南極板塊邊界",
                coords: [[-55, -65], [-60, -45], [-58, -25], [-62, 10], [-65, 60]],
                density: 20, speed: 0.0022, color: 0xa855f7, type: "剪切走滑/擴張"
            }
        ];

        const RADIUS = 100;
        let scene, camera, renderer, controls, globeGroup;
        let markerObjects = [];
        let waveParticleSystem = []; // 波動粒子陣列
        let currentIndex = 0;
        let isAutoPlaying = false;
        let autoPlayTimer = null;
        let globalClock = 0;

        const container = document.getElementById('webgl-container');
        const dialogCard = document.getElementById('dialog-card');

        function latLngToVector3(lat, lng, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lng + 180) * (Math.PI / 180);
            return new THREE.Vector3(
                -radius * Math.sin(phi) * Math.cos(theta),
                radius * Math.cos(phi),
                radius * Math.sin(phi) * Math.sin(theta)
            );
        }

        async function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 30, 280);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; 
            controls.dampingFactor = 0.05;
            controls.minDistance = 120; 
            controls.maxDistance = 500;

            globeGroup = new THREE.Group();
            scene.add(globeGroup);

            // 地球貼圖與材質
            const textureLoader = new THREE.TextureLoader();
            const earthTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
            const bumpTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-topology.png');

            const earthGeo = new THREE.SphereGeometry(RADIUS, 64, 64);
            const earthMat = new THREE.MeshPhongMaterial({ 
                map: earthTexture,
                bumpMap: bumpTexture,
                bumpScale: 1.5,
                specular: new THREE.Color('#1e293b'), 
                shininess: 15
            });
            const earthMesh = new THREE.Mesh(earthGeo, earthMat);
            globeGroup.add(earthMesh);

            // 大氣光暈
            const atmosphereGeo = new THREE.SphereGeometry(RADIUS * 1.015, 64, 64);
            const atmosphereMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.15, side: THREE.BackSide });
            globeGroup.add(new THREE.Mesh(atmosphereGeo, atmosphereMat));

            scene.add(new THREE.AmbientLight(0xffffff, 0.9));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(200, 100, 200);
            scene.add(dirLight);

            // 建立板塊交界底線與 Wave 應力流光粒子系統
            loadTectonicPlates();
            buildWaveStressSystem();

            // 載入即時地震資料並啟動輪詢
            await refreshUSGSData();
            setInterval(refreshUSGSData, API_POLL_INTERVAL);

            window.addEventListener('resize', onWindowResize);
            focusEvent(0);
            animate();
        }

        // 載入全球主要板塊交界線
        function loadTectonicPlates() {
            fetch('https://raw.githubusercontent.com/fraxen/tectonicplates/master/GeoJSON/PB2002_boundaries.json')
                .then(res => res.json())
                .then(data => {
                    const material = new THREE.LineBasicMaterial({ color: 0x475569, transparent: true, opacity: 0.4, linewidth: 1 });
                    data.features.forEach(feature => {
                        const coords = feature.geometry.coordinates;
                        const points = [];
                        coords.forEach(coord => {
                            points.push(latLngToVector3(coord[1], coord[0], RADIUS + 0.4));
                        });
                        const geometry = new THREE.BufferGeometry().setFromPoints(points);
                        const line = new THREE.Line(geometry, material);
                        globeGroup.add(line);
                    });
                })
                .catch(err => console.log('Plate fallback:', err));
        }

        // 依據構造應力密度建立 Wave 波動流光粒子
        function buildWaveStressSystem() {
            stressFaultZones.forEach(zone => {
                // 產生 3D 曲線路徑
                const curvePoints = zone.coords.map(c => latLngToVector3(c[0], c[1], RADIUS + 0.8));
                const curve = new THREE.CatmullRomCurve3(curvePoints);

                // 依密度配置粒子數量
                const count = zone.density;
                for (let i = 0; i < count; i++) {
                    const size = THREE.MathUtils.randFloat(0.8, 1.6);
                    const pGeo = new THREE.SphereGeometry(size, 8, 8);
                    const pMat = new THREE.MeshBasicMaterial({ 
                        color: zone.color,
                        transparent: true,
                        opacity: 0.8
                    });
                    const pMesh = new THREE.Mesh(pGeo, pMat);
                    globeGroup.add(pMesh);

                    waveParticleSystem.push({
                        mesh: pMesh,
                        curve: curve,
                        progress: i / count,
                        speed: zone.speed,
                        baseSize: size,
                        color: zone.color,
                        phase: i * 0.4 // 波浪正弦相位差
                    });
                }
            });
        }

        // USGS API 即時抓取 (支援高緯度/南極 M5.0+ 與全球 M5.6+)
        async function refreshUSGSData() {
            try {
                const response = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_month.geojson');
                const data = await response.json();
                
                allEarthquakeData = allEarthquakeData.filter(d => !d.id.startsWith("usgs_"));

                data.features.forEach(eq => {
                    const mag = eq.properties.mag;
                    const lat = eq.geometry.coordinates[1];
                    const lng = eq.geometry.coordinates[0];
                    const depth = eq.geometry.coordinates[2];

                    if (mag >= 5.6 || (lat < -45 && mag >= 5.0)) {
                        const place = eq.properties.place;
                        const timeStr = new Date(eq.properties.time).toISOString().split('T')[0];
                        
                        allEarthquakeData.push({
                            id: "usgs_" + eq.id,
                            type: "real",
                            date: timeStr + " (USGS即時)",
                            location: place,
                            lat: lat,
                            lng: lng,
                            mag: "M " + mag.toFixed(1),
                            depth: depth.toFixed(0) + " km",
                            desc: `USGS 自動回報。震央座標 [${lat.toFixed(2)}, ${lng.toFixed(2)}]。`
                        });
                    }
                });

                document.getElementById('sync-status').innerText = `已同步 USGS 即時數據 (共 ${allEarthquakeData.length} 筆)`;
                rebuildMarkersAndControls();
            } catch (e) {
                console.log("USGS API Fallback", e);
                document.getElementById('sync-status').innerText = 'USGS 連線逾時，使用快取數據';
            }
        }

        function rebuildMarkersAndControls() {
            markerObjects.forEach(m => {
                globeGroup.remove(m.mesh);
                globeGroup.remove(m.ring);
            });
            markerObjects = [];

            allEarthquakeData.forEach((eq) => {
                const pos = latLngToVector3(eq.lat, eq.lng, RADIUS + 1.2);
                const color = eq.type === 'real' ? 0xef4444 : 0xeab308;

                const markerGeo = new THREE.SphereGeometry(eq.type === 'real' ? 2.2 : 2.8, 16, 16);
                const markerMat = new THREE.MeshBasicMaterial({ color: color });
                const markerMesh = new THREE.Mesh(markerGeo, markerMat);
                markerMesh.position.copy(pos);

                const ringGeo = new THREE.RingGeometry(1.8, eq.type === 'real' ? 4.5 : 6.5, 32);
                const ringMat = new THREE.MeshBasicMaterial({ color: color, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
                const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                ringMesh.position.copy(pos);
                ringMesh.lookAt(new THREE.Vector3(0, 0, 0));

                globeGroup.add(markerMesh);
                globeGroup.add(ringMesh);

                markerObjects.push({ mesh: markerMesh, ring: ringMesh, pos: pos, data: eq, scale: 1 });
            });

            const bar = document.getElementById('timeline-controls');
            bar.innerHTML = '<button class="btn-step" id="btn-auto">自動導覽</button>';
            const autoBtn = document.getElementById('btn-auto');

            allEarthquakeData.forEach((eq, idx) => {
                const btn = document.createElement('button');
                btn.className = `btn-step ${eq.type === 'predict' ? 'predict-btn' : ''}`;
                btn.id = `btn-step-${idx}`;
                const shortName = eq.location.split(',')[0].split(' of ')[1] || eq.location.split(' ')[0];
                btn.innerText = `${idx + 1}. ${eq.type === 'predict' ? '[預測]' : ''}${shortName}`;
                btn.onclick = () => { stopAutoPlay(); focusEvent(idx); };
                bar.insertBefore(btn, autoBtn);
            });

            autoBtn.onclick = () => {
                if (isAutoPlaying) { stopAutoPlay(); } else { startAutoPlay(); }
            };
        }

        function focusEvent(index) {
            if (!markerObjects[index]) return;
            currentIndex = index;
            const target = markerObjects[index];

            document.querySelectorAll('.btn-step').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-step-${index}`);
            if (activeBtn) activeBtn.classList.add('active');

            targetRotationY = -target.data.lng * (Math.PI / 180) - (Math.PI / 2);
            targetRotationX = target.data.lat * (Math.PI / 180);

            const badge = document.getElementById('c-badge');
            if (target.data.type === 'predict') {
                badge.className = 'badge-type predict';
                badge.innerText = '科學預測高風險區';
            } else {
                badge.className = 'badge-type real';
                badge.innerText = '實際發生地震';
            }

            document.getElementById('c-title').innerText = target.data.location;
            document.getElementById('c-date').innerText = target.data.date;
            document.getElementById('c-mag').innerText = target.data.mag;
            document.getElementById('c-depth').innerText = `深度 ${target.data.depth}`;
            document.getElementById('c-desc').innerText = target.data.desc;

            dialogCard.style.display = 'block';
            dialogCard.style.opacity = '1';
        }

        let targetRotationY = 0;
        let targetRotationX = 0;

        function startAutoPlay() {
            isAutoPlaying = true;
            document.getElementById('btn-auto').innerText = '暫停導覽';
            document.getElementById('btn-auto').classList.add('active');
            clearInterval(autoPlayTimer);
            autoPlayTimer = setInterval(() => {
                currentIndex = (currentIndex + 1) % allEarthquakeData.length;
                focusEvent(currentIndex);
            }, 5000);
        }

        function stopAutoPlay() {
            isAutoPlaying = false;
            document.getElementById('btn-auto').innerText = '自動導覽';
            document.getElementById('btn-auto').classList.remove('active');
            clearInterval(autoPlayTimer);
        }

        function updateDialogPosition() {
            if (markerObjects.length === 0 || !markerObjects[currentIndex]) return;
            const currentMarker = markerObjects[currentIndex];
            const worldPos = currentMarker.pos.clone().applyMatrix4(globeGroup.matrixWorld);
            const screenPos = worldPos.project(camera);
            const x = (screenPos.x * .5 + .5) * window.innerWidth;
            const y = (-(screenPos.y * .5) + .5) * window.innerHeight;

            if (screenPos.z < 0.98) {
                dialogCard.style.display = 'block';
                dialogCard.style.left = `${x - 160}px`;
                dialogCard.style.top = `${y - 180}px`;
            } else {
                dialogCard.style.display = 'none';
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            globalClock += 0.05;

            globeGroup.rotation.y += (targetRotationY - globeGroup.rotation.y) * 0.04;
            globeGroup.rotation.x += (targetRotationX - globeGroup.rotation.x) * 0.04;

            // 地震脈衝環動畫
            markerObjects.forEach(m => {
                m.scale += 0.02;
                if (m.scale > 2.5) m.scale = 1;
                m.ring.scale.set(m.scale, m.scale, 1);
                m.ring.material.opacity = (2.5 - m.scale) / 1.5;
            });

            // Wave 應力流光粒子波浪運動
            waveParticleSystem.forEach(p => {
                p.progress += p.speed;
                if (p.progress > 1) p.progress = 0;
                
                const pt = p.curve.getPoint(p.progress);
                p.mesh.position.copy(pt);

                // 正弦波動脈衝（縮放與透明度律動）
                const wave = Math.sin(globalClock * 2 + p.phase);
                const dynamicScale = 1 + wave * 0.35;
                p.mesh.scale.set(dynamicScale, dynamicScale, dynamicScale);
                p.mesh.material.opacity = 0.5 + (wave + 1) * 0.25;
            });

            controls.update();
            updateDialogPosition();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
