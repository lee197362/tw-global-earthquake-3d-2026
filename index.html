<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Tectonic Dynamics & Real-time Earthquake Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #020617; 
            color: #f3f4f6; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            overflow: hidden; 
            user-select: none;
        }
        #webgl-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .header {
            position: absolute;
            top: 20px;
            left: 24px;
            z-index: 10;
            pointer-events: none;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #38bdf8;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }
        .header p {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }
        .sync-badge {
            display: inline-block;
            margin-top: 6px;
            font-size: 11px;
            color: #4ade80;
            background: rgba(34, 197, 94, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .sync-badge.error {
            color: #f87171;
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.35);
        }

        .view-controls {
            position: absolute;
            top: 20px;
            right: 24px;
            z-index: 10;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            max-width: 500px;
            justify-content: flex-end;
        }
        .btn-mode {
            background: rgba(15, 23, 42, 0.85);
            color: #cbd5e1;
            border: 1px solid rgba(56, 189, 248, 0.3);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-mode.active, .btn-mode:hover {
            background: #0284c7;
            color: #fff;
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        /* HUD 與 Tabs 切換設計 */
        #cross-section-panel {
            position: absolute;
            top: 70px;
            right: 24px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(56, 189, 248, 0.4);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 14px 16px;
            width: 340px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            display: none;
        }
        .hud-title {
            font-size: 13px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        #section-canvas {
            width: 100%;
            height: 150px;
            background: #090d16;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        /* Webcams 與 News 標籤頁 CSS */
        .section-tab-container { margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px; }
        .section-tabs { display: flex; gap: 12px; font-size: 11px; margin-bottom: 8px; }
        .section-tab { color: #94a3b8; cursor: pointer; padding-bottom: 2px; }
        .section-tab.active { color: #fff; border-bottom: 2px solid #38bdf8; font-weight: bold; }
        .section-content { font-size: 11px; color: #cbd5e1; line-height: 1.4; display: none; max-height: 100px; overflow-y: auto; }
        .section-content.active { display: block; }
        .info-list-item { margin-bottom: 6px; border-bottom: 1px dashed rgba(255,255,255,0.08); padding-bottom: 4px; }
        .info-link { color: #38bdf8; text-decoration: none; font-size: 11.5px; cursor: pointer; }
        .info-link:hover { color: #fff; }
        .info-meta { color: #94a3b8; font-size: 10px; margin-top: 2px; }

        #dialog-card {
            position: absolute;
            z-index: 20;
            background: rgba(15, 23, 42, 0.94);
            border: 1px solid rgba(56, 189, 248, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 14px 18px;
            width: 320px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
            display: none;
            pointer-events: none;
        }
        .badge-type {
            font-size: 10px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 6px;
        }
        .badge-type.real { background: #ef4444; color: #fff; }
        .badge-type.predict { background: #eab308; color: #0f172a; }
        .badge-type.tsunami { background: #06b6d4; color: #fff; margin-left: 4px; }
        .badge-type.depth-level { background: #6366f1; color: #fff; margin-left: 4px; }
        .card-title { font-size: 15px; font-weight: bold; color: #fff; margin-bottom: 4px; }
        .card-meta { font-size: 12px; color: #38bdf8; margin-bottom: 6px; display: flex; gap: 8px; flex-wrap: wrap; }
        .card-desc { font-size: 11px; color: #cbd5e1; line-height: 1.4; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 6px; }

        .timeline-container {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 12px 20px;
            width: min(850px, 92vw);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .timeline-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }
        .timeline-slider-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .slider-play-btn {
            background: #0284c7;
            border: none;
            color: white;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            flex-shrink: 0;
        }
        .timeline-slider {
            flex-grow: 1;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: #334155;
            outline: none;
            cursor: pointer;
        }
        .timeline-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #38bdf8;
            box-shadow: 0 0 8px #38bdf8;
            cursor: pointer;
        }
        .timeline-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border: none;
            border-radius: 50%;
            background: #38bdf8;
            box-shadow: 0 0 8px #38bdf8;
            cursor: pointer;
        }
        .timeline-slider::-moz-range-track {
            height: 6px;
            border-radius: 3px;
            background: #334155;
        }
        .events-btn-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 2px;
        }
        .btn-step {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 4px 10px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 10.5px;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .btn-step:hover { background: #38bdf8; color: #0f172a; }
        .btn-step.active { background: #f97316; border-color: #f97316; color: #fff; font-weight: bold; }
        .btn-step.predict-btn { border-color: #eab308; color: #eab308; }
        .btn-step.predict-btn.active { background: #eab308; color: #0f172a; }

        #share-toast {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(14, 165, 233, 0.95);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 100;
            display: none;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; top: 60px; } to { opacity: 1; top: 70px; } }

        #loading-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #020617;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            transition: opacity 0.5s ease;
        }
        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-spinner {
            width: 42px;
            height: 42px;
            border: 3px solid rgba(56, 189, 248, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading-screen p {
            font-size: 12px;
            color: #94a3b8;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

            <div class="section-content" id="tab-webcams">
                <!-- 動態注入 Webcam 資料 -->

            <div class="section-content" id="tab-news">

    <div id="dialog-card">
        <span class="badge-type real" id="c-badge">實際發生</span>

        function latLngToVector3(lat, lng, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lng + 180) * (Math.PI / 180);
            return new THREE.Vector3(
                -radius * Math.sin(phi) * Math.cos(theta),
                radius * Math.cos(phi),
                radius * Math.sin(phi) * Math.sin(theta)
            );
        }

        // 事件按鈕地名縮寫：分別處理 CJK（中日文）與拉丁字母地名，
        // 避免 EMSC 的中文 flynn_region 或非 "X of Y" 格式的地名被錯誤截斷。
        function getShortEventLabel(location) {
            if (!location) return '';

            // 去除 USGS 常見的距離方位前綴，例如 "12km SE of "
            let cleaned = location.replace(/^\d+(\.\d+)?\s*km\s*[A-Z]*\s*of\s+/i, '');
            // 取逗號（含全形逗號）前的第一段，去掉國家/地區後綴
            cleaned = cleaned.split(',')[0].split('，')[0].trim();

            if (!cleaned) return location.trim();

            const isCJK = /[\u4e00-\u9fff\u3040-\u30ff\uac00-\ud7a3]/.test(cleaned);

            if (isCJK) {
                // 中日韓文字沒有空白分詞，直接以字元數截斷
                const maxChars = 9;
                return cleaned.length > maxChars ? cleaned.slice(0, maxChars) + '…' : cleaned;
            }

            // 拉丁字母地名：以完整單字為單位截斷，避免斷在字中間
            const maxChars = 18;
            if (cleaned.length <= maxChars) return cleaned;
            const words = cleaned.split(' ');
            let result = '';
            for (const w of words) {
                const next = (result ? result + ' ' + w : w);
                if (next.length > maxChars) break;
                result = next;
            }
            return (result || cleaned.slice(0, maxChars)) + '…';
        }

        function disposeObject(obj) {
            if (!obj) return;
            if (obj.geometry) obj.geometry.dispose();
            if (obj.material) {
                if (Array.isArray(obj.material)) {
                    obj.material.forEach(mat => disposeMaterial(mat));
                } else {
                    disposeMaterial(obj.material);
                }
            }
            if (obj.children && obj.children.length > 0) {
                obj.children.forEach(child => disposeObject(child));
            }
        }

        function disposeMaterial(mat) {
            if (!mat) return;
            if (mat.map) mat.map.dispose();
            if (mat.bumpMap) mat.bumpMap.dispose();
            if (mat.specularMap) mat.specularMap.dispose();
            mat.dispose();
        }

        function createGlowPointTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 30);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.3, 'rgba(255, 255, 255, 0.8)');
            grad.addColorStop(0.7, 'rgba(255, 255, 255, 0.2)');
            grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        function createTextSprite(text, isPredict) {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = isPredict ? 'rgba(234, 179, 8, 0.95)' : 'rgba(239, 68, 68, 0.95)';
            ctx.font = 'bold 22px -apple-system, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = '#000';
            ctx.shadowBlur = 4;
            ctx.fillText(text, 64, 32);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(9, 4.5, 1);
            return sprite;
        }

        // 建立 3D 向量箭頭
        function create3DVelocityArrow(ptSurface, ptEnd, color, speed) {
            const group = new THREE.Group();
            
            const stemPoints = [ptSurface, ptEnd];
            const stemGeo = new THREE.BufferGeometry().setFromPoints(stemPoints);
            const stemMat = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.8, linewidth: 2 });
            const stem = new THREE.Line(stemGeo, stemMat);
            group.add(stem);

            const headSize = Math.min(speed / 12, 1.0);
            const headGeo = new THREE.ConeGeometry(headSize * 0.4, headSize, 8);
            const headMat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.9 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.copy(ptEnd);
            head.lookAt(ptSurface);
            head.rotateX(Math.PI / 2);
            group.add(head);

            return group;
        }

        function loadTectonicPlates() {
            fetch('https://raw.githubusercontent.com/fraxen/tectonicplates/master/GeoJSON/PB2002_boundaries.json')

                .then(data => {
                    const material = new THREE.LineBasicMaterial({ color: 0x475569, transparent: true, opacity: 0.35, linewidth: 1 });
                    data.features.forEach(feature => {

        function buildPlateVelocityGroup() {
            AppState.scene.plateVelocityGroup = new THREE.Group();
            globeGroup.add(AppState.scene.plateVelocityGroup);

                    const ptSurface = latLngToVector3(center.lat + dLat, center.lng + dLng, RADIUS + 0.6);

                    const arrowLen = Math.min(center.speed / 4, 3.0);
                    const ptEnd = ptSurface.clone().normalize().multiplyScalar(RADIUS + 0.6 + arrowLen);
                    
                    const arrowMesh = create3DVelocityArrow(ptSurface, ptEnd, center.color, center.speed);
                    AppState.scene.plateVelocityGroup.add(arrowMesh);

        function buildStressFieldGroup() {
            AppState.scene.stressFieldGroup = new THREE.Group();
            globeGroup.add(AppState.scene.stressFieldGroup);

            const palette = [new THREE.Color('#e0e7ff'), new THREE.Color('#c084fc'), new THREE.Color('#38bdf8')];
            stressNebulaCenters.forEach(center => {
                const count = Math.floor(center.count * 0.8);
                const positions = new Float32Array(count * 3);
                const colors = new Float32Array(count * 3);

                for (let i = 0; i < count; i++) {
                    const u = Math.random(); const v = Math.random();
                    const r = Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
                    const angle = Math.random() * Math.PI * 2;
                    
                    const dLat = (r * Math.cos(angle)) * (center.radiusDeg * 0.7);
                    const dLng = (r * Math.sin(angle)) * (center.radiusDeg * 0.7);
                    
                    const altitude = RADIUS * 0.98 + Math.random() * RADIUS * 0.05;
                    const pos = latLngToVector3(center.lat + dLat, center.lng + dLng, altitude);

                    const i3 = i * 3;
                    positions[i3] = pos.x; positions[i3+1] = pos.y; positions[i3+2] = pos.z;
                    const col = palette[Math.floor(Math.random() * palette.length)].clone();
                    colors[i3] = col.r; colors[i3+1] = col.g; colors[i3+2] = col.b;
                }
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                
                const material = new THREE.PointsMaterial({ 
                    size: 1.8, vertexColors: true, map: createGlowPointTexture(), 
                    blending: THREE.AdditiveBlending, transparent: true, opacity: 0.35, depthWrite: false 
                });
                AppState.scene.stressFieldGroup.add(new THREE.Points(geometry, material));
            });
            AppState.scene.stressFieldGroup.visible = AppState.toggles.stress;
        }

        // GPU 版本星雲擾動：擾動邏輯搬到 vertex shader，CPU 端每幀只更新一個 uniform
        function buildSpectralNebulaPointCloud() {
            let total = 0;
            stressNebulaCenters.forEach(c => total += c.count);

            const positions = new Float32Array(total * 3);
            const colors = new Float32Array(total * 3);
            const noiseSeeds = new Float32Array(total);

            const palette = [
                new THREE.Color('#c084fc'),
                new THREE.Color('#f43f5e'),
                new THREE.Color('#fb923c'),
                new THREE.Color('#2dd4bf'),
                new THREE.Color('#38bdf8'),
                new THREE.Color('#e0e7ff')
            ];

            let pIdx = 0;
            stressNebulaCenters.forEach(center => {
                for (let i = 0; i < center.count; i++) {
                    const u = Math.random();
                    const v = Math.random();
                    const r = Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
                    const angle = Math.random() * Math.PI * 2;
                    
                    const dLat = (r * Math.cos(angle)) * (center.radiusDeg * 0.4);
                    const dLng = (r * Math.sin(angle)) * (center.radiusDeg * 0.4);
                    const altitude = RADIUS + 0.5 + Math.random() * 2.5;

                    const pos = latLngToVector3(center.lat + dLat, center.lng + dLng, altitude);

                    positions[pIdx * 3] = pos.x;
                    positions[pIdx * 3 + 1] = pos.y;
                    positions[pIdx * 3 + 2] = pos.z;

                    noiseSeeds[pIdx] = i * 0.1;

                    const col = palette[Math.floor(Math.random() * palette.length)].clone();
                    colors[pIdx * 3] = col.r;
                    colors[pIdx * 3 + 1] = col.g;
                    colors[pIdx * 3 + 2] = col.b;

                    pIdx++;
                }
            });

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('aSeed', new THREE.BufferAttribute(noiseSeeds, 1));

            AppState.scene.nebulaMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uRadius: { value: RADIUS },
                    uTexture: { value: createGlowPointTexture() },
                    uSize: { value: 1.5 }
                },
                vertexShader: `
                    uniform float uTime;
                    uniform float uRadius;
                    uniform float uSize;
                    attribute float aSeed;
                    varying vec3 vColor;
                    void main() {
                        vColor = color;
                        float noise = sin(uTime * 1.5 + aSeed) * 0.4;
                        vec3 displaced = position + (position / uRadius) * noise;
                        vec4 mvPosition = modelViewMatrix * vec4(displaced, 1.0);
                        gl_PointSize = uSize * (300.0 / -mvPosition.z);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    uniform sampler2D uTexture;
                    varying vec3 vColor;
                    void main() {
                        vec4 tex = texture2D(uTexture, gl_PointCoord);
                        gl_FragColor = vec4(vColor, 1.0) * tex;
                        gl_FragColor.a *= 0.75;
                    }
                `,
                vertexColors: true,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            AppState.scene.nebulaPointsMesh = new THREE.Points(geometry, AppState.scene.nebulaMaterial);
            globeGroup.add(AppState.scene.nebulaPointsMesh);
        }

        async function refreshMultiSourceData() {
            const rawEvents = [];
            let activeSources = [];
            let hadFailure = false;

            try {
                const resUSGS = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_month.geojson');
                const dataUSGS = await resUSGS.json();
                dataUSGS.features.forEach(eq => {
                    const mag = eq.properties.mag;
                    const coords = eq.geometry.coordinates;
                    if (mag >= 5.5 || (coords[1] < -45 && mag >= 5.0)) {
                        rawEvents.push({
                            id: "usgs_" + eq.id,
                            source: "USGS",
                            timestamp: eq.properties.time,
                            lat: coords[1],
                            lng: coords[0],
                            depth: Math.round(coords[2]),
                            mag: "M " + mag.toFixed(1),
                            location: eq.properties.place,
                            dipAngle: Math.floor(20 + Math.random() * 25),
                            isOceanic: Math.abs(coords[1]) < 55 && coords[2] < 60
                        });
                    }
                });
                activeSources.push("USGS");
            } catch (e) {
                console.warn("USGS API Fallback", e);
                hadFailure = true;
            }

            try {
                const resEMSC = await fetch('https://www.seismicportal.eu/fdsnws/event/1/query?limit=60&minmag=5.5&format=json');
                const dataEMSC = await resEMSC.json();
                if (dataEMSC && dataEMSC.features) {
                    dataEMSC.features.forEach(eq => {
                        const props = eq.properties;
                        const coords = eq.geometry.coordinates;
                        const t = new Date(props.time).getTime();
                        rawEvents.push({
                            id: "emsc_" + (props.unid || eq.id),
                            source: "EMSC",
                            timestamp: t,
                            lat: coords[1],
                            lng: coords[0],
                            depth: Math.round(Math.abs(coords[2])),
                            mag: "M " + parseFloat(props.mag).toFixed(1),
                            location: props.flynn_region || "EMSC Event",
                            dipAngle: Math.floor(22 + Math.random() * 24),
                            isOceanic: Math.abs(coords[1]) < 55 && Math.abs(coords[2]) < 60
                        });
                    });
                    activeSources.push("EMSC");
                }
            } catch (e) {
                console.warn("EMSC API Fallback", e);
                hadFailure = true;
            }

            const deduplicatedReals = [];
            rawEvents.sort((a, b) => a.timestamp - b.timestamp);

            rawEvents.forEach(evt => {
                const isDuplicate = deduplicatedReals.some(existing => {
                    const timeDiff = Math.abs(existing.timestamp - evt.timestamp);
                    const distDiff = Math.hypot(existing.lat - evt.lat, existing.lng - evt.lng);
                    return timeDiff < 90000 && distDiff < 1.5;
                });

                if (!isDuplicate) {
                    const timeStr = new Date(evt.timestamp).toISOString().split('T')[0];
                    deduplicatedReals.push({
                        ...evt,
                        type: "real",
                        date: `${timeStr} (${evt.source})`,
                        desc: `[${evt.source}] 震央座標 [${evt.lat.toFixed(2)}, ${evt.lng.toFixed(2)}]，${lang.depthLabel} ${evt.depth} km。`
                    });
                }
            });

            const predictItems = AppState.data.earthquakes.filter(d => d.type === "predict");
            AppState.data.earthquakes = [...predictItems, ...deduplicatedReals];

            if (activeSources.length > 0) {
                const sourceText = activeSources.join(" + ");
                setSyncStatus(true, `已同步 ${sourceText} 即時數據 (${AppState.data.earthquakes.length} 筆)`);
            } else {
                setSyncStatus(false, lang.syncError);
            }
            filterEventsByTimeline(parseInt(document.getElementById('timeline-slider').value));
        }

        function filterEventsByTimeline(percentage) {
            if (AppState.data.earthquakes.length === 0) return;
            const predicts = AppState.data.earthquakes.filter(e => e.type === 'predict');
            const reals = AppState.data.earthquakes.filter(e => e.type === 'real');

            let activeEvents = [...predicts];

            if (reals.length > 0) {
                const minTime = reals[0].timestamp;
                const maxTime = reals[reals.length - 1].timestamp;
                const cutoffTime = minTime + (maxTime - minTime) * (percentage / 100);
                const filteredReals = reals.filter(e => e.timestamp <= cutoffTime);
                activeEvents = [...predicts, ...filteredReals];

                document.getElementById('lbl-timeline-date').innerText = percentage >= 100 ? lang.allTime : new Date(cutoffTime).toISOString().split('T')[0];
            }

            document.getElementById('lbl-event-count').innerText = activeEvents.length;
            rebuildMarkersAndControls(activeEvents);
        }

        function rebuildMarkersAndControls(activeEvents) {
            AppState.scene.markerObjects.forEach(m => {
                globeGroup.remove(m.dot);
                globeGroup.remove(m.ring1);
                globeGroup.remove(m.ring2);
                globeGroup.remove(m.sprite);
                if (m.hitSphere) globeGroup.remove(m.hitSphere);
                if (m.pillar) globeGroup.remove(m.pillar);

                disposeObject(m.dot);
                disposeObject(m.ring1);
                disposeObject(m.ring2);
                disposeObject(m.sprite);
                if (m.hitSphere) disposeObject(m.hitSphere);
                if (m.pillar) disposeObject(m.pillar);
            });

            AppState.scene.tsunamiWaveRings.forEach(tw => {
                globeGroup.remove(tw.mesh);
                disposeObject(tw.mesh);
            });

            AppState.scene.markerObjects = [];
            AppState.scene.clickableHitTargets = [];
            AppState.scene.tsunamiWaveRings = [];

            activeEvents.forEach((eq, idx) => {
                const isPredict = eq.type === 'predict';
                const depthInfo = getDepthVisuals(eq.depth);
                const color = isPredict ? 0xeab308 : depthInfo.color;

                const posSurface = latLngToVector3(eq.lat, eq.lng, RADIUS + 0.8);

                const depthScale = Math.min(eq.depth / 20, 18);
                const posDepth = latLngToVector3(eq.lat, eq.lng, RADIUS - depthScale);

                const pillarGeo = new THREE.BufferGeometry().setFromPoints([posSurface, posDepth]);
                const pillarMat = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.7, linewidth: 2 });
                const pillarMesh = new THREE.Line(pillarGeo, pillarMat);
                globeGroup.add(pillarMesh);

                const dotGeo = new THREE.SphereGeometry(0.7, 12, 12);
                const dotMat = new THREE.MeshBasicMaterial({ color: color });
                const dotMesh = new THREE.Mesh(dotGeo, dotMat);
                dotMesh.position.copy(posSurface);

                const ringGeo = new THREE.RingGeometry(1.2, 1.45, 32);
                const ringMat1 = new THREE.MeshBasicMaterial({ color: color, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
                const ringMesh1 = new THREE.Mesh(ringGeo, ringMat1);
                ringMesh1.position.copy(posSurface);
                ringMesh1.lookAt(new THREE.Vector3(0, 0, 0));

                const ringMat2 = new THREE.MeshBasicMaterial({ color: color, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
                const ringMesh2 = new THREE.Mesh(ringGeo.clone(), ringMat2);
                ringMesh2.position.copy(posSurface);
                ringMesh2.lookAt(new THREE.Vector3(0, 0, 0));

                const sprite = createTextSprite(eq.mag, isPredict);
                const textPos = latLngToVector3(eq.lat, eq.lng, RADIUS + 4.2);
                sprite.position.copy(textPos);

                const hitGeo = new THREE.SphereGeometry(3.6, 8, 8);
                const hitMat = new THREE.MeshBasicMaterial({ visible: false });
                const hitMesh = new THREE.Mesh(hitGeo, hitMat);
                hitMesh.position.copy(posSurface);
                hitMesh.userData = { eventIndex: idx };
                globeGroup.add(hitMesh);
                AppState.scene.clickableHitTargets.push(hitMesh);

                globeGroup.add(dotMesh);
                globeGroup.add(ringMesh1);
                globeGroup.add(ringMesh2);
                globeGroup.add(sprite);

                const numMag = parseFloat(eq.mag.replace(/[^0-9.]/g, ''));
                if (eq.isOceanic && numMag >= 7.0 && eq.depth < 70) {
                    for (let w = 0; w < 3; w++) {
                        const tGeo = new THREE.RingGeometry(2.0, 2.5, 48);
                        const tMat = new THREE.MeshBasicMaterial({ color: 0x06b6d4, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
                        const tMesh = new THREE.Mesh(tGeo, tMat);
                        tMesh.position.copy(posSurface);
                        tMesh.lookAt(new THREE.Vector3(0, 0, 0));
                        tMesh.visible = AppState.toggles.tsunami;
                        globeGroup.add(tMesh);

                        AppState.scene.tsunamiWaveRings.push({
                            mesh: tMesh,
                            scale: 1.0 + w * 3.5,
                            speed: 0.025,
                            maxScale: 14.0
                        });
                    }
                }

                AppState.scene.markerObjects.push({
                    dot: dotMesh,
                    hitSphere: hitMesh,
                    pillar: pillarMesh,
                    ring1: ringMesh1,
                    ring2: ringMesh2,
                    sprite: sprite,
                    pos: posSurface,
                    data: eq,
                    scale1: 1.0,
                    scale2: 2.4
                });
            });

            const bar = document.getElementById('events-btn-container');
            bar.innerHTML = '';
            activeEvents.forEach((eq, idx) => {
                const btn = document.createElement('button');
                btn.className = `btn-step ${eq.type === 'predict' ? 'predict-btn' : ''}`;
                btn.id = `btn-step-${idx}`;
                const shortName = getShortEventLabel(eq.location);
                btn.innerText = `${idx + 1}. ${eq.type === 'predict' ? lang.predictPrefix : ''}${shortName}`;
                btn.onclick = () => { focusEvent(idx, true, true); };
                bar.appendChild(btn);
            });
        }

        // 更新 HUD 中的 Webcams 與 News
        function updateHudInfoTabs(eventId) {
            const webcamContent = document.getElementById('tab-webcams');
            webcamContent.innerHTML = '';
            const cams = mockWebcamData[eventId] || mockWebcamData["default"];
            cams.forEach(cam => {
                const item = document.createElement('div');
                item.className = 'info-list-item';
                const linkEl = document.createElement('div');
                linkEl.className = 'info-link';
                linkEl.textContent = `📷 ${cam.title}`;
                const metaEl = document.createElement('div');
                metaEl.className = 'info-meta';
                metaEl.textContent = `類型: ${cam.type} · 更新: ${cam.time}`;
                item.appendChild(linkEl);
                item.appendChild(metaEl);
                webcamContent.appendChild(item);
            });

            const newsContent = document.getElementById('tab-news');
            newsContent.innerHTML = '';
            const news = mockNewsData[eventId] || mockNewsData["default"];
            news.forEach(n => {
                const item = document.createElement('div');
                item.className = 'info-list-item';
                const linkEl = document.createElement('div');
                linkEl.className = 'info-link';
                linkEl.textContent = `📰 ${n.title}`;
                const metaEl = document.createElement('div');
                metaEl.className = 'info-meta';
                metaEl.textContent = `來源: ${n.media}`;
                item.appendChild(linkEl);
                item.appendChild(metaEl);
                newsContent.appendChild(item);
            });
        }

        function drawCrossSection(data) {
            if (!AppState.toggles.section) return;
            const w = sectionCanvas.width;
            const h = sectionCanvas.height;
            sCtx.clearRect(0, 0, w, h);

            const bgGrad = sCtx.createLinearGradient(0, 0, 0, h);
            bgGrad.addColorStop(0, "#0c1527");
            bgGrad.addColorStop(0.5, "#172554");
            bgGrad.addColorStop(1, "#020617");
            sCtx.fillStyle = bgGrad;
            sCtx.fillRect(0, 0, w, h);

            if (data.isOceanic) {
                sCtx.fillStyle = "rgba(6, 182, 212, 0.35)";
                sCtx.fillRect(0, 0, w * 0.55, 14);
                sCtx.fillStyle = "#38bdf8";
                sCtx.font = "9px sans-serif";
                sCtx.fillText("Sea Level", 10, 10);
            }

            const dip = (data.dipAngle || 30) * (Math.PI / 180);

            sCtx.beginPath();
            sCtx.moveTo(0, 15);
            sCtx.lineTo(w * 0.45, 15);
            sCtx.lineTo(w * 0.9, h - 10);
            sCtx.lineTo(w * 0.8, h);
            sCtx.lineTo(w * 0.35, 35);
            sCtx.lineTo(0, 35);
            sCtx.closePath();
            sCtx.fillStyle = "rgba(56, 189, 248, 0.25)";
            sCtx.fill();
            sCtx.strokeStyle = "#38bdf8";
            sCtx.lineWidth = 1.5;
            sCtx.stroke();

            sCtx.beginPath();
            sCtx.moveTo(w * 0.48, 15);
            sCtx.lineTo(w, 15);
            sCtx.lineTo(w, h - 20);
            sCtx.lineTo(w * 0.92, h - 10);
            sCtx.closePath();
            sCtx.fillStyle = "rgba(249, 115, 22, 0.18)";
            sCtx.fill();
            sCtx.strokeStyle = "#f97316";
            sCtx.lineWidth = 1.5;
            sCtx.stroke();

            sCtx.setLineDash([4, 4]);
            sCtx.strokeStyle = "rgba(148, 163, 184, 0.5)";
            sCtx.beginPath();
            sCtx.moveTo(w * 0.5, 40);
            sCtx.lineTo(w, 40);
            sCtx.stroke();
            sCtx.setLineDash([]);

            sCtx.fillStyle = "#94a3b8";
            sCtx.font = "9px sans-serif";
            sCtx.fillText("Moho", w - 45, 36);

            const focusX = w * 0.45 + (data.depth / 150) * (w * 0.35);
            const focusY = 15 + Math.sin(dip) * (data.depth * 0.8);

            const depthInfo = getDepthVisuals(data.depth);
            sCtx.fillStyle = data.type === 'predict' ? "#eab308" : depthInfo.hex;
            sCtx.beginPath();
            sCtx.arc(focusX, Math.min(focusY, h - 25), 5, 0, Math.PI * 2);
            sCtx.fill();

            sCtx.fillStyle = "#fff";
            sCtx.font = "bold 10px sans-serif";
            sCtx.fillText(`★ ${data.depth} km`, focusX - 20, Math.min(focusY, h - 25) - 10);

            document.getElementById('hud-subduction-angle').innerText = `Dip: ${data.dipAngle || 28}°`;
        }

        function focusEvent(index, updateUrl = true, shouldZoom = true) {
            if (!AppState.scene.markerObjects[index]) return;
            AppState.view.currentIndex = index;
            const target = AppState.scene.markerObjects[index];

            document.querySelectorAll('.btn-step').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-step-${index}`);
            if (activeBtn) {
                activeBtn.classList.add('active');
                activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }

            AppState.view.targetRotationY = -target.data.lng * (Math.PI / 180) - (Math.PI / 2);
            AppState.view.targetRotationX = target.data.lat * (Math.PI / 180);

            if (shouldZoom) {
                AppState.view.targetCameraDist = 175;
            }

            const badge = document.getElementById('c-badge');
            if (target.data.type === 'predict') {
                badge.className = 'badge-type predict';
                badge.innerText = lang.badgePredict;
            } else {
                badge.className = 'badge-type real';
                badge.innerText = lang.badgeReal;
            }

            const tsunamiBadge = document.getElementById('c-tsunami-badge');
            const numMag = parseFloat(target.data.mag.replace(/[^0-9.]/g, ''));
            if (target.data.isOceanic && numMag >= 7.0 && target.data.depth < 70) {
                tsunamiBadge.style.display = 'inline-block';
                tsunamiBadge.innerText = lang.badgeTsunami;
            } else {
                tsunamiBadge.style.display = 'none';
            }

            const depthBadge = document.getElementById('c-depth-badge');
            const depthInfo = getDepthVisuals(target.data.depth);
            depthBadge.innerText = depthInfo.text;
            depthBadge.style.background = depthInfo.hex;

            document.getElementById('c-title').innerText = target.data.location;
            document.getElementById('c-date').innerText = target.data.date;
            document.getElementById('c-mag').innerText = target.data.mag;
            document.getElementById('c-depth').innerText = `${lang.depthLabel} ${target.data.depth} km`;
            document.getElementById('c-desc').innerText = target.data.desc;

            dialogCard.style.display = 'block';
            dialogCard.style.opacity = '1';

            drawCrossSection(target.data);
            updateHudInfoTabs(target.data.id); // 更新 Tabs 內容

            if (updateUrl && target.data.id) {
                const newUrl = new URL(window.location);
                newUrl.searchParams.set('id', target.data.id);
                window.history.replaceState({}, '', newUrl);
            }
        }

        function setupRaycasterListeners() {
            let pointerDownTime = 0;
            let startX = 0, startY = 0;

            window.addEventListener('pointerdown', (e) => {
                pointerDownTime = Date.now();
                startX = e.clientX;
                startY = e.clientY;
            });

            // 節流：滑鼠移動只記錄座標，實際 raycast 交給 rAF 迴圈統一處理
            window.addEventListener('pointermove', (e) => {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                AppState.interaction.pendingHoverCheck = true;
            });

            window.addEventListener('pointerup', (e) => {
                const clickDuration = Date.now() - pointerDownTime;
                const distMoved = Math.hypot(e.clientX - startX, e.clientY - startY);

                if (clickDuration < 300 && distMoved < 6) {
                    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(AppState.scene.clickableHitTargets);

                    if (intersects.length > 0) {
                        const targetEventIdx = intersects[0].object.userData.eventIndex;
                        if (targetEventIdx !== undefined) {
                            focusEvent(targetEventIdx, true, true);
                        }
                    }
                }
            });
        }

        function updateHoverState() {
            if (!AppState.interaction.pendingHoverCheck) return;
            AppState.interaction.pendingHoverCheck = false;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(AppState.scene.clickableHitTargets);
            document.body.style.cursor = intersects.length > 0 ? 'pointer' : 'default';
        }

        function handleDeepLinkRouting() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetId = urlParams.get('id');
            const paramLat = parseFloat(urlParams.get('lat'));
            const paramLng = parseFloat(urlParams.get('lng'));

            if (targetId) {
                const foundIdx = AppState.data.earthquakes.findIndex(e => e.id === targetId);
                if (foundIdx !== -1) {
                    setTimeout(() => {
                        focusEvent(foundIdx, false, true);
                    }, 600);
                    return;
                }
            }

            if (!isNaN(paramLat) && !isNaN(paramLng)) {
                focusOnCoordinates(paramLat, paramLng);
                return;
            }

            autoLocateUserTimezone();
        }

        function setupUIEventListeners() {
            const slider = document.getElementById('timeline-slider');
            slider.oninput = (e) => {
                stopTimelinePlay();
                filterEventsByTimeline(parseInt(e.target.value));
            };

            const playBtn = document.getElementById('btn-timeline-play');
            playBtn.onclick = () => {
                if (AppState.timeline.isPlaying) { stopTimelinePlay(); } else { startTimelinePlay(); }
            };

            document.getElementById('btn-toggle-nebula').onclick = function() {
                AppState.toggles.nebula = !AppState.toggles.nebula;
                this.classList.toggle('active', AppState.toggles.nebula);
                if (AppState.scene.nebulaPointsMesh) AppState.scene.nebulaPointsMesh.visible = AppState.toggles.nebula;
            };

            document.getElementById('btn-toggle-tsunami').onclick = function() {
                AppState.toggles.tsunami = !AppState.toggles.tsunami;
                this.classList.toggle('active', AppState.toggles.tsunami);
                AppState.scene.tsunamiWaveRings.forEach(tw => tw.mesh.visible = AppState.toggles.tsunami);
            };

            document.getElementById('btn-toggle-section').onclick = function() {
                AppState.toggles.section = !AppState.toggles.section;
                this.classList.toggle('active', AppState.toggles.section);
                document.getElementById('cross-section-panel').style.display = AppState.toggles.section ? 'block' : 'none';
                if (AppState.toggles.section && AppState.scene.markerObjects[AppState.view.currentIndex]) { drawCrossSection(AppState.scene.markerObjects[AppState.view.currentIndex].data); }
            };

            // 本次新增：切換板塊向量與應力場按鈕
            document.getElementById('btn-toggle-plates').onclick = function() {
                AppState.toggles.plates = !AppState.toggles.plates;
                this.classList.toggle('active', AppState.toggles.plates);
                if (AppState.scene.plateVelocityGroup) AppState.scene.plateVelocityGroup.visible = AppState.toggles.plates;
            };

            document.getElementById('btn-toggle-stress').onclick = function() {
                AppState.toggles.stress = !AppState.toggles.stress;
                this.classList.toggle('active', AppState.toggles.stress);
                if (AppState.scene.stressFieldGroup) AppState.scene.stressFieldGroup.visible = AppState.toggles.stress;
            };

            document.getElementById('btn-share-link').onclick = () => {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    const toast = document.getElementById('share-toast');
                    toast.style.display = 'block';
                    setTimeout(() => { toast.style.display = 'none'; }, 2200);
                });
            };

            // 本次新增：Tabs 切換邏輯
            document.querySelectorAll('.section-tab').forEach(tab => {
                tab.onclick = function() {
                    document.querySelectorAll('.section-tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.section-content').forEach(c => c.classList.remove('active'));
                    this.classList.add('active');
                    document.getElementById(`tab-${this.dataset.tab}`).classList.add('active');
                };
            });

            document.getElementById('cross-section-panel').style.display = 'block';
        }

        function startTimelinePlay() {
            AppState.timeline.isPlaying = true;
            document.getElementById('btn-timeline-play').innerText = '❚❚';
            const slider = document.getElementById('timeline-slider');
            if (parseInt(slider.value) >= 100) slider.value = 0;
            AppState.timeline.timerId = setInterval(() => {
                let val = parseInt(slider.value) + 1;
                if (val > 100) { stopTimelinePlay(); } else {
                    slider.value = val;
                    filterEventsByTimeline(val);
                }
            }, 120);
        }

        function stopTimelinePlay() {
            AppState.timeline.isPlaying = false;
            document.getElementById('btn-timeline-play').innerText = '▶';
            clearInterval(AppState.timeline.timerId);
        }

        function updateDialogPosition() {
            if (AppState.scene.markerObjects.length === 0 || !AppState.scene.markerObjects[AppState.view.currentIndex]) {
                if (dialogCard.style.display !== 'none') dialogCard.style.display = 'none';
                return;
            }
            const currentMarker = AppState.scene.markerObjects[AppState.view.currentIndex];
            const worldPos = currentMarker.pos.clone().applyMatrix4(globeGroup.matrixWorld);
            const screenPos = worldPos.project(camera);
            const x = (screenPos.x * .5 + .5) * window.innerWidth;
            const y = (-(screenPos.y * .5) + .5) * window.innerHeight;

            if (screenPos.z < 0.98) {
                dialogCard.style.display = 'block';
                dialogCard.style.left = `${x - 160}px`;
                dialogCard.style.top = `${y - 180}px`;
            } else {
                dialogCard.style.display = 'none';
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            AppState.view.clock += 0.03;

            globeGroup.rotation.y += (AppState.view.targetRotationY - globeGroup.rotation.y) * 0.05;
            globeGroup.rotation.x += (AppState.view.targetRotationX - globeGroup.rotation.x) * 0.05;
            camera.position.z += (AppState.view.targetCameraDist - camera.position.z) * 0.05;

            AppState.scene.markerObjects.forEach(m => {
                m.scale1 += 0.01; if (m.scale1 > 3.8) m.scale1 = 1.0;
                m.ring1.scale.set(m.scale1, m.scale1, 1);
                m.ring1.material.opacity = Math.max(0, (3.8 - m.scale1) / 2.8);

                m.scale2 += 0.01; if (m.scale2 > 3.8) m.scale2 = 1.0;
                m.ring2.scale.set(m.scale2, m.scale2, 1);
                m.ring2.material.opacity = Math.max(0, (3.8 - m.scale2) / 2.8);
            });

            if (AppState.toggles.tsunami) {
                AppState.scene.tsunamiWaveRings.forEach(tw => {
                    tw.scale += tw.speed;
                    if (tw.scale > tw.maxScale) tw.scale = 1.0;
                    tw.mesh.scale.set(tw.scale, tw.scale, 1);
                    tw.mesh.material.opacity = Math.max(0, (tw.maxScale - tw.scale) / tw.maxScale) * 0.85;
                });
            }

            // GPU shader 版本：CPU 端每幀只更新一個 uniform，不再逐點運算
            if (AppState.toggles.nebula && AppState.scene.nebulaMaterial) {
                AppState.scene.nebulaMaterial.uniforms.uTime.value = AppState.view.clock;
            }

            // 月球應力梯度場呼吸閃爍效果
            if (AppState.toggles.stress && AppState.scene.stressFieldGroup) {
                const breathing = 0.35 + Math.sin(AppState.view.clock * 2) * 0.1;
                AppState.scene.stressFieldGroup.children.forEach(points => {
                    points.material.opacity = breathing;
                });
            }

            updateHoverState();
            controls.update();
            updateDialogPosition();
            renderer.render(scene, camera);
        }

        const timezoneCoordsMap = {
            "Asia/Taipei": { lat: 23.69, lng: 120.96 },
            "Asia/Tokyo": { lat: 35.68, lng: 139.76 },
            "Asia/Shanghai": { lat: 31.23, lng: 121.47 },
            "America/New_York": { lat: 40.71, lng: -74.00 },
            "America/Los_Angeles": { lat: 34.05, lng: -118.24 },
            "Europe/London": { lat: 51.50, lng: -0.12 },
            "Australia/Sydney": { lat: -33.86, lng: 151.20 }
        };

        function autoLocateUserTimezone() {
            const userTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            let targetLat = 23.69;
            let targetLng = 120.96;

            if (timezoneCoordsMap[userTimezone]) {
                targetLat = timezoneCoordsMap[userTimezone].lat;
                targetLng = timezoneCoordsMap[userTimezone].lng;
            }

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => { focusOnCoordinates(pos.coords.latitude, pos.coords.longitude); },
                    () => { focusOnCoordinates(targetLat, targetLng); },
                    { timeout: 3000 }
                );
            } else {
                focusOnCoordinates(targetLat, targetLng);
            }
        }

        function focusOnCoordinates(lat, lng) {
            AppState.view.targetRotationY = -lng * (Math.PI / 180) - (Math.PI / 2);
            AppState.view.targetRotationX = lat * (Math.PI / 180);

            let closestIdx = 0;
            let minDistance = Infinity;

            AppState.data.earthquakes.forEach((eq, idx) => {
                const d = Math.hypot(eq.lat - lat, eq.lng - lng);
                if (d < minDistance) {
                    minDistance = d;
                    closestIdx = idx;
                }
            });

            setTimeout(() => {
                focusEvent(closestIdx, false, false);
            }, 800);
        }

        init();
    </script>
