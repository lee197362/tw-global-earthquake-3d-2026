<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Tectonic Dynamics & Real-time Earthquake Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #020617; 
            color: #f3f4f6; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            overflow: hidden; 
            user-select: none;
        }
        #webgl-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .header { position: absolute; top: 20px; left: 24px; z-index: 10; pointer-events: none; }
        .header h1 { font-size: 20px; font-weight: 700; letter-spacing: 1px; color: #38bdf8; text-shadow: 0 0 12px rgba(56, 189, 248, 0.4); }
        .header p { font-size: 12px; color: #94a3b8; margin-top: 4px; }
        .sync-badge { display: inline-block; margin-top: 6px; font-size: 11px; color: #4ade80; background: rgba(34, 197, 94, 0.1); padding: 2px 8px; border-radius: 4px; border: 1px solid rgba(34, 197, 94, 0.3); }

        .view-controls { position: absolute; top: 20px; right: 24px; z-index: 10; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
        .btn-mode { background: rgba(15, 23, 42, 0.85); color: #cbd5e1; border: 1px solid rgba(56, 189, 248, 0.3); backdrop-filter: blur(8px); padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: all 0.2s; }
        .btn-mode.active, .btn-mode:hover { background: #0284c7; color: #fff; border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }

        /* 右側可收合浮動欄位 */
        #right-sidebar {
            position: absolute; top: 70px; right: 0; width: 340px; height: calc(100vh - 170px);
            background: rgba(15, 23, 42, 0.92); border-left: 1px solid rgba(56, 189, 248, 0.4);
            border-top: 1px solid rgba(56, 189, 248, 0.4); border-bottom: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 12px 0 0 12px; backdrop-filter: blur(12px); z-index: 15;
            display: flex; flex-direction: column; transform: translateX(0);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: -10px 0 25px rgba(0,0,0,0.6);
        }
        #right-sidebar.collapsed { transform: translateX(340px); }
        .sidebar-toggle-btn {
            position: absolute; left: -24px; top: 50%; transform: translateY(-50%);
            width: 24px; height: 60px; background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(56, 189, 248, 0.4); border-right: none; border-radius: 8px 0 0 8px;
            color: #38bdf8; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 14px; font-weight: bold; box-shadow: -5px 0 10px rgba(0,0,0,0.3);
        }
        .sidebar-toggle-btn:hover { background: rgba(30, 41, 59, 0.95); }
        .sidebar-content { padding: 16px; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 16px; }
        .sidebar-content::-webkit-scrollbar { width: 4px; }
        .sidebar-content::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        .sidebar-content::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 2px; }

        /* 模組卡片設計 */
        .module-card { background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; }
        .module-header { font-size: 13px; font-weight: 700; color: #38bdf8; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(56, 189, 248, 0.2); padding-bottom: 6px; }
        #section-canvas { width: 100%; height: 140px; background: #090d16; border-radius: 6px; border: 1px solid rgba(255,255,255,0.05); }
        .info-list-item { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed rgba(255,255,255,0.08); font-size: 11px; color: #cbd5e1; }
        .info-list-item:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        .info-item-title { color: #fff; font-weight: 600; margin-bottom: 3px; display: flex; align-items: center; gap: 6px; }
        .info-item-meta { color: #94a3b8; font-size: 10px; display: flex; justify-content: space-between; align-items: center; }
        .status-tag { padding: 2px 5px; border-radius: 3px; font-size: 9px; font-weight: bold; }
        .status-online { background: rgba(74, 222, 128, 0.15); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.3); }
        .status-archive { background: rgba(148, 163, 184, 0.15); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.3); }
        .empty-text { color: #64748b; font-style: italic; font-size: 11px; text-align: center; padding: 10px 0; }

        /* 地震資訊對話框 */
        #dialog-card { position: absolute; z-index: 20; background: rgba(15, 23, 42, 0.94); border: 1px solid rgba(56, 189, 248, 0.5); backdrop-filter: blur(10px); border-radius: 12px; padding: 14px 18px; width: 320px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7); display: none; pointer-events: none; }
        .badge-type { font-size: 10px; font-weight: bold; padding: 2px 8px; border-radius: 4px; display: inline-block; margin-bottom: 6px; }
        .badge-type.real { background: #ef4444; color: #fff; }
        .badge-type.predict { background: #eab308; color: #0f172a; }
        .badge-type.tsunami { background: #06b6d4; color: #fff; margin-left: 4px; }
        .badge-type.depth-level { background: #6366f1; color: #fff; margin-left: 4px; }
        .card-title { font-size: 15px; font-weight: bold; color: #fff; margin-bottom: 4px; }
        .card-meta { font-size: 12px; color: #38bdf8; margin-bottom: 6px; display: flex; gap: 8px; flex-wrap: wrap; }
        .card-desc { font-size: 11px; color: #cbd5e1; line-height: 1.4; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 6px; }

        /* 時間軸 */
        .timeline-container { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 10; background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(12px); border-radius: 16px; padding: 12px 20px; width: min(850px, 92vw); display: flex; flex-direction: column; gap: 8px; }
        .timeline-top-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
        .timeline-slider-row { display: flex; align-items: center; gap: 12px; }
        .slider-play-btn { background: #0284c7; border: none; color: white; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; }
        .timeline-slider { flex-grow: 1; -webkit-appearance: none; height: 6px; border-radius: 3px; background: #334155; outline: none; cursor: pointer; }
        .timeline-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #38bdf8; box-shadow: 0 0 8px #38bdf8; cursor: pointer; }
        .events-btn-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
        .btn-step { background: #1e293b; color: #f8fafc; border: 1px solid rgba(255, 255, 255, 0.15); padding: 4px 10px; border-radius: 12px; cursor: pointer; font-size: 10.5px; white-space: nowrap; transition: all 0.2s; }
        .btn-step:hover { background: #38bdf8; color: #0f172a; }
        .btn-step.active { background: #f97316; border-color: #f97316; color: #fff; font-weight: bold; }
        .btn-step.predict-btn { border-color: #eab308; color: #eab308; }
        .btn-step.predict-btn.active { background: #eab308; color: #0f172a; }

        #share-toast { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); background: rgba(14, 165, 233, 0.95); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 100; display: none; }
        
        /* 載入畫面，避免首屏白屏 */
        #loading-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #020617; z-index: 9999; display: flex; align-items: center; justify-content: center; color: #38bdf8; font-weight: bold; font-size: 18px; transition: opacity 0.5s; }
    </style>
</head>
<body>
    <div id="loading-screen">啟動三維構造引擎與連線資料庫...</div>
    <div id="share-toast">已複製專屬分享網址到剪貼簿！</div>

    <div class="header">
        <h1 id="ui-title">全球板塊構造動力學與海嘯擴散平台</h1>
        <p id="ui-subtitle">USGS + EMSC 多來源即時融合 · 板塊動態流 · 記憶體效能優化版</p>
        <div class="sync-badge" id="sync-status">多元即時資料連線中...</div>
    </div>

    <div id="right-sidebar">
        <div class="sidebar-toggle-btn" id="btn-toggle-sidebar">▶</div>
        <div class="sidebar-content">
            <div class="module-card">
                <div class="module-header">
                    <span>📐 構造幾何與震源剖面</span>
                    <span id="hud-subduction-angle" style="font-weight: normal; font-size: 11px; color: #94a3b8;">傾角: --</span>
                </div>
                <canvas id="section-canvas" width="308" height="140"></canvas>
                <div style="font-size: 11px; color: #cbd5e1; margin-top: 8px; line-height: 1.4;" id="hud-section-note">
                    請點選左側 3D 地球上的地震事件，以即時演算板塊界面應力與震源破裂機制。
                </div>
            </div>
            <div class="module-card">
                <div class="module-header"><span>📹 區域實況 Webcams</span></div>
                <div id="webcam-list"><div class="empty-text">尚無選定區域之影像訊號...</div></div>
            </div>
            <div class="module-card">
                <div class="module-header"><span>📰 區域地質新聞快訊</span></div>
                <div id="news-list"><div class="empty-text">尚無選定區域之新聞資訊...</div></div>
            </div>
        </div>
    </div>

    <div id="dialog-card">
        <span class="badge-type real" id="c-badge">實際發生</span>
        <span class="badge-type tsunami" id="c-tsunami-badge" style="display:none;">海嘯風險</span>
        <span class="badge-type depth-level" id="c-depth-badge">淺層地震</span>
        <div class="card-title" id="c-title">載入中...</div>
        <div class="card-meta"><span id="c-date">--</span><span id="c-mag">--</span><span id="c-depth">--</span></div>
        <div class="card-desc" id="c-desc">--</div>
    </div>

    <div class="timeline-container">
        <div class="timeline-top-row">
            <span style="color:#94a3b8;">📅 時序基準：<b id="lbl-timeline-date" style="color:#38bdf8;">--</b></span>
            <span style="color:#94a3b8;">顯示中事件：<b id="lbl-event-count" style="color:#f97316;">--</b> 筆</span>
        </div>
        <div class="timeline-slider-row">
            <button class="slider-play-btn" id="btn-timeline-play">▶</button>
            <input type="range" class="timeline-slider" id="timeline-slider" min="0" max="100" value="0">
        </div>
        <div class="events-btn-scroll" id="events-btn-container"></div>
    </div>

    <div id="webgl-container"></div>

    <!-- 延遲載入 (defer) 避免阻塞 DOM 渲染 -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 模擬數據庫 (擴充資料量以展示效能)
        let allEarthquakeData = [
            { id: "p1", type: "predict", timestamp: new Date("2026-12-31").getTime(), date: "預測視窗：2026 Q3-Q4", location: "台灣東部外海 (琉球海溝段)", lat: 23.8, lng: 122.5, mag: "M 7.2", depth: 22, dipAngle: 26, isOceanic: true, desc: "菲律賓海板塊向西北隱沒至歐亞板塊下方，滑動赤字累積達 8.0 cm/yr。" },
            { id: "p2", type: "predict", timestamp: new Date("2026-12-31").getTime(), date: "預測視窗：2026 下半年", location: "南美洲 中段隱沒帶 (祕魯/智利交界)", lat: -18.5, lng: -70.3, mag: "M 7.5", depth: 35, dipAngle: 22, isOceanic: true, desc: "納斯卡板塊東向低角度俯衝南美陸塊，特大逆衝破裂長週期窗口逼近。" },
            { id: "r1", type: "real", timestamp: new Date("2026-06-07").getTime(), date: "2026/06/07", location: "菲律賓 棉蘭老島西南外海", lat: 5.92, lng: 124.95, mag: "M 7.8", depth: 57, dipAngle: 38, isOceanic: true, desc: "哥塔巴托海溝板塊交界面逆衝破裂，具備中等海嘯波前傳播特性。" },
            { id: "r2", type: "real", timestamp: new Date("2026-08-14").getTime(), date: "2026/08/14", location: "印尼 弗洛勒斯海", lat: -7.60, lng: 121.90, mag: "M 7.7", depth: 10, dipAngle: 32, isOceanic: true, desc: "弗洛勒斯後弧逆衝帶淺層極強破裂，引發顯著局部海嘯波擴散。" },
            { id: "r3", type: "real", timestamp: new Date("2026-08-20").getTime(), date: "2026/08/20", location: "日本 本州東海岸附近海域", lat: 37.5, lng: 142.1, mag: "M 6.5", depth: 40, dipAngle: 30, isOceanic: true, desc: "太平洋板塊隱沒帶中等規模破裂，無明顯海嘯威脅。" }
        ];
        
        const mockWebcamData = {
            "taiwan": [ { title: "宜蘭南方澳漁港", type: "海洋監測", status: "online", time: "即時" }, { title: "花蓮港海務觀測", type: "氣象監測", status: "online", time: "1分鐘前" } ],
            "southamerica": [ { title: "Arica Port Cam 1", type: "Port Auth", status: "online", time: "即時" }, { title: "Iquique Tsunami Buoy", type: "SHOA", status: "online", time: "5分鐘前" } ],
            "indonesia": [ { title: "Maumere Harbor E", type: "BMKG", status: "online", time: "即時" }, { title: "Flores Sea Buoy", type: "InaTEWS", status: "online", time: "即時" } ],
            "default": [ { title: "全球公用觀測站", type: "衛星觀測", status: "archive", time: "1小時前" } ]
        };
        
        const mockNewsData = {
            "taiwan": [ { title: "東部外海板塊交界處微震頻繁", media: "中央通訊社", time: "2小時前" } ],
            "southamerica": [ { title: "Peru-Chile Trench seismic gap monitoring", media: "Geology Today", time: "12小時前" } ],
            "indonesia": [ { title: "Flores thrust displacement warning issued", media: "BMKG Reports", time: "6小時前" } ],
            "default": [ { title: "近期板塊活動綜述", media: "USGS", time: "1天前" } ]
        };

        const RADIUS = 100;
        let scene, camera, renderer, controls, globeGroup;
        let markerObjects = [];
        let clickableHitTargets = [];
        let targetCameraPos = new THREE.Vector3(0, 30, 280); 
        
        let currentIndex = -1;
        let showTsunami = true;
        let isTimelinePlaying = false;
        let timelineTimer = null;

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const container = document.getElementById('webgl-container');
        const dialogCard = document.getElementById('dialog-card');
        const sectionCanvas = document.getElementById('section-canvas');
        const sCtx = sectionCanvas.getContext('2d');

        // ================= 記憶體優化：資源共享池 =================
        // 集中宣告幾何體與靜態材質，避免迴圈內重複 new 造成 VRAM 暴增
        const sharedRes = { geo: {}, mat: {}, spriteCache: {} };

        function latLngToVector3(lat, lng, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lng + 180) * (Math.PI / 180);
            return new THREE.Vector3( -radius * Math.sin(phi) * Math.cos(theta), radius * Math.cos(phi), radius * Math.sin(phi) * Math.sin(theta) );
        }

        // ================= 記憶體優化：快取 Sprite 文字 =================
        function getCachedSpriteMaterial(text, isPredict) {
            const key = text + (isPredict ? '_p' : '_r');
            if (sharedRes.spriteCache[key]) return sharedRes.spriteCache[key];

            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = isPredict ? 'rgba(234, 179, 8, 0.95)' : 'rgba(239, 68, 68, 0.95)';
            ctx.font = 'bold 22px -apple-system, sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(text, 64, 32);
            
            const mat = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), depthTest: false });
            sharedRes.spriteCache[key] = mat;
            return mat;
        }

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.copy(targetCameraPos);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            // 限制像素比例，防止超高解析度螢幕(如 Retina)佔用過多 GPU 資源
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); 
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.dampingFactor = 0.05;
            controls.minDistance = 120; controls.maxDistance = 500;

            globeGroup = new THREE.Group();
            scene.add(globeGroup);

            // ================= 記憶體優化：幾何減面 =================
            // 地球分段由 64x64 降為 48x48，減少將近 50% 的頂點運算量
            const texLoader = new THREE.TextureLoader();
            const earthMat = new THREE.MeshPhongMaterial({ 
                map: texLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg', () => {
                    // 貼圖載入完成後隱藏 Loading
                    document.getElementById('loading-screen').style.opacity = '0';
                    setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 500);
                }),
                bumpMap: texLoader.load('https://unpkg.com/three-globe/example/img/earth-topology.png'),
                bumpScale: 1.5, specular: new THREE.Color('#1e293b'), shininess: 15
            });
            globeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(RADIUS, 48, 48), earthMat));
            
            // 降低網格分段
            globeGroup.add(new THREE.Mesh(new THREE.IcosahedronGeometry(RADIUS * 1.04, 2), new THREE.MeshBasicMaterial({ color: 0x334155, wireframe: true, transparent: true, opacity: 0.16 })));

            scene.add(new THREE.AmbientLight(0xffffff, 0.9));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(200, 100, 200);
            scene.add(dirLight);

            // 初始化共用幾何體與材質
            sharedRes.geo.dot = new THREE.SphereGeometry(0.7, 8, 8); // 減面
            sharedRes.geo.ring = new THREE.RingGeometry(1.2, 1.45, 24); // 減面
            sharedRes.geo.hit = new THREE.SphereGeometry(3.5, 8, 8);
            sharedRes.geo.tsunami = new THREE.RingGeometry(2.0, 2.5, 32);
            
            sharedRes.mat.dotReal = new THREE.MeshBasicMaterial({ color: 0xef4444 });
            sharedRes.mat.dotPredict = new THREE.MeshBasicMaterial({ color: 0xeab308 });
            sharedRes.mat.hit = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0 }); // 隱形碰撞用
            sharedRes.mat.lineReal = new THREE.LineBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.7 });
            sharedRes.mat.linePredict = new THREE.LineBasicMaterial({ color: 0xeab308, transparent: true, opacity: 0.7 });

            rebuildMarkersAndControls();

            const now = Date.now();
            const reals = allEarthquakeData.filter(e => e.type === 'real');
            let initialPercent = 100;
            if (reals.length > 0) {
                const minTime = reals[0].timestamp;
                const maxTime = reals[reals.length - 1].timestamp;
                const currentClamp = Math.max(minTime, Math.min(now, maxTime));
                initialPercent = ((currentClamp - minTime) / (maxTime - minTime)) * 100;
            }
            document.getElementById('timeline-slider').value = initialPercent;
            filterEventsByTimeline(initialPercent);

            setupUIEventListeners();
            
            window.addEventListener('click', (event) => {
                if(event.target.tagName === 'BUTTON' || event.target.closest('#right-sidebar') || event.target.closest('.timeline-container')) return;
                
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                
                const intersects = raycaster.intersectObjects(clickableHitTargets);
                if (intersects.length > 0) { focusEvent(intersects[0].object.userData.eventIndex); }
            });

            // 加入 Debounce 防抖，減少連續縮放視窗造成的卡頓
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                }, 100);
            });

            animate();
        }

        function filterEventsByTimeline(percentage) {
            const reals = allEarthquakeData.filter(e => e.type === 'real');
            if (reals.length === 0) return;
            const minTime = reals[0].timestamp;
            const maxTime = reals[reals.length - 1].timestamp;
            
            const cutoffTime = percentage >= 100 ? Date.now() + 31536000000 : minTime + (maxTime - minTime) * (percentage / 100);

            let visibleCount = 0;
            markerObjects.forEach((m, idx) => {
                const isVisible = (m.data.type === 'predict' && percentage >= 100) || (m.data.type === 'real' && m.data.timestamp <= cutoffTime);
                m.dot.visible = isVisible; m.pillar.visible = isVisible;
                m.ring1.visible = isVisible; m.ring2.visible = isVisible;
                m.sprite.visible = isVisible; m.hitSphere.visible = isVisible; 
                if (m.tsunamiRings) m.tsunamiRings.forEach(tr => tr.mesh.visible = isVisible && showTsunami);

                const btn = document.getElementById(`btn-step-${idx}`);
                if (btn) btn.style.display = isVisible ? 'inline-block' : 'none';
                if (isVisible) visibleCount++;
            });

            document.getElementById('lbl-event-count').innerText = visibleCount;
            const dateStr = percentage >= 100 ? "包含未來預測" : new Date(cutoffTime).toISOString().split('T')[0];
            document.getElementById('lbl-timeline-date').innerText = dateStr;
        }

        function rebuildMarkersAndControls() {
            markerObjects.forEach(m => { globeGroup.remove(m.dot); globeGroup.remove(m.hitSphere); });
            markerObjects = []; clickableHitTargets = [];
            const bar = document.getElementById('events-btn-container'); bar.innerHTML = '';

            allEarthquakeData.forEach((eq, idx) => {
                const isPredict = eq.type === 'predict';
                const colorHex = isPredict ? 0xeab308 : 0xef4444;
                const posSurface = latLngToVector3(eq.lat, eq.lng, RADIUS + 0.8);
                const posDepth = latLngToVector3(eq.lat, eq.lng, RADIUS - Math.min(eq.depth / 15, 15));

                // Pillar 線段幾何體必須獨立，但共用材質
                const pillarMesh = new THREE.Line(new THREE.BufferGeometry().setFromPoints([posSurface, posDepth]), isPredict ? sharedRes.mat.linePredict : sharedRes.mat.lineReal);
                
                // Dot 共用幾何體與材質
                const dotMesh = new THREE.Mesh(sharedRes.geo.dot, isPredict ? sharedRes.mat.dotPredict : sharedRes.mat.dotReal);
                dotMesh.position.copy(posSurface);

                // Ring 動態需要獨立變更 Opacity，所以 clone 材質，但共用幾何體
                const ringMatBase = new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
                const r1 = new THREE.Mesh(sharedRes.geo.ring, ringMatBase); r1.position.copy(posSurface); r1.lookAt(0,0,0);
                const r2 = new THREE.Mesh(sharedRes.geo.ring, ringMatBase.clone()); r2.position.copy(posSurface); r2.lookAt(0,0,0);
                
                const sprite = new THREE.Sprite(getCachedSpriteMaterial(eq.mag, isPredict));
                sprite.position.copy(latLngToVector3(eq.lat, eq.lng, RADIUS + 4.2)); sprite.scale.set(9, 4.5, 1);
                
                // HitBox 共用幾何與材質
                const hitSphere = new THREE.Mesh(sharedRes.geo.hit, sharedRes.mat.hit);
                hitSphere.position.copy(posSurface); hitSphere.userData = { eventIndex: idx };

                globeGroup.add(pillarMesh, dotMesh, r1, r2, sprite, hitSphere);
                clickableHitTargets.push(hitSphere);

                let tRings = [];
                if (eq.isOceanic && parseFloat(eq.mag.replace(/[^0-9.]/g, '')) >= 7.0 && eq.depth < 70) {
                    for (let w = 0; w < 3; w++) {
                        const tM = new THREE.Mesh(sharedRes.geo.tsunami, new THREE.MeshBasicMaterial({ color: 0x06b6d4, side: THREE.DoubleSide, transparent: true, opacity: 0.8 }));
                        tM.position.copy(posSurface); tM.lookAt(0,0,0); globeGroup.add(tM);
                        tRings.push({ mesh: tM, scale: 1.0 + w * 3.5, speed: 0.025, maxScale: 14.0 });
                    }
                }
                markerObjects.push({ dot: dotMesh, pillar: pillarMesh, ring1: r1, ring2: r2, sprite: sprite, hitSphere: hitSphere, pos: posSurface, data: eq, scale1: 1.0, scale2: 2.4, tsunamiRings: tRings });

                const btn = document.createElement('button');
                btn.className = `btn-step ${isPredict ? 'predict-btn' : ''}`;
                btn.id = `btn-step-${idx}`;
                btn.innerText = `${idx + 1}. ${isPredict ? '[預測]' : ''}${eq.location.split(' ')[0]}`;
                btn.onclick = () => focusEvent(idx);
                bar.appendChild(btn);
            });
        }

        function drawCrossSection(data) {
            const w = sectionCanvas.width, h = sectionCanvas.height;
            sCtx.clearRect(0, 0, w, h);
            const bg = sCtx.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, "#0c1527"); bg.addColorStop(1, "#020617");
            sCtx.fillStyle = bg; sCtx.fillRect(0, 0, w, h);

            if (data.isOceanic) { sCtx.fillStyle = "rgba(6,182,212,0.3)"; sCtx.fillRect(0, 0, w*0.5, 12); }
            const dip = (data.dipAngle || 30) * (Math.PI / 180);
            
            sCtx.beginPath(); sCtx.moveTo(0, 15); sCtx.lineTo(w*0.45, 15); sCtx.lineTo(w*0.9, h-10); sCtx.lineTo(w*0.8, h); sCtx.lineTo(w*0.35, 35); sCtx.lineTo(0, 35);
            sCtx.fillStyle = "rgba(56,189,248,0.25)"; sCtx.fill(); sCtx.strokeStyle = "#38bdf8"; sCtx.stroke();
            
            sCtx.beginPath(); sCtx.moveTo(w*0.48, 15); sCtx.lineTo(w, 15); sCtx.lineTo(w, h-20); sCtx.lineTo(w*0.92, h-10);
            sCtx.fillStyle = "rgba(249,115,22,0.18)"; sCtx.fill(); sCtx.strokeStyle = "#f97316"; sCtx.stroke();

            const fx = w*0.45 + (data.depth/150)*(w*0.35), fy = 15 + Math.sin(dip)*(data.depth*0.8);
            sCtx.fillStyle = data.type === 'predict' ? "#eab308" : "#ef4444";
            sCtx.beginPath(); sCtx.arc(fx, Math.min(fy, h-20), 4, 0, Math.PI*2); sCtx.fill();

            document.getElementById('hud-subduction-angle').innerText = `傾角: ${data.dipAngle || 28}°`;
            document.getElementById('hud-section-note').innerText = data.desc;
        }

        function populateList(containerId, dataArray, icon) {
            const el = document.getElementById(containerId);
            el.innerHTML = '';
            if(!dataArray || dataArray.length === 0) { el.innerHTML = `<div class="empty-text">尚無區域資料...</div>`; return; }
            
            dataArray.forEach(item => {
                const isOnline = item.status === "online";
                el.innerHTML += `
                    <div class="info-list-item">
                        <div class="info-item-title"><span>${icon}</span><span>${item.title}</span></div>
                        <div class="info-item-meta">
                            <span>${item.type || item.media}</span>
                            <span>${item.status ? `<span class="status-tag ${isOnline ? 'status-online' : 'status-archive'}">${isOnline ? 'LIVE' : 'ARCHIVE'}</span> ` : ''}${item.time}</span>
                        </div>
                    </div>`;
            });
        }

        function focusEvent(index) {
            if (!markerObjects[index]) return;
            currentIndex = index;
            const target = markerObjects[index];

            targetCameraPos = latLngToVector3(target.data.lat, target.data.lng, RADIUS * 1.8);

            document.querySelectorAll('.btn-step').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-step-${index}`).classList.add('active');

            const bdg = document.getElementById('c-badge');
            bdg.className = `badge-type ${target.data.type === 'predict' ? 'predict' : 'real'}`;
            bdg.innerText = target.data.type === 'predict' ? '科學預警' : '實際發生';

            document.getElementById('c-title').innerText = target.data.location;
            document.getElementById('c-date').innerText = target.data.date;
            document.getElementById('c-mag').innerText = target.data.mag;
            document.getElementById('c-depth').innerText = `深度 ${target.data.depth} km`;
            document.getElementById('c-desc').innerText = target.data.desc;
            
            dialogCard.style.display = 'block';

            drawCrossSection(target.data);
            const locKey = target.data.location.substring(0, 3); 
            populateList('webcam-list', mockWebcamData[locKey] || mockWebcamData['default'], '📹');
            populateList('news-list', mockNewsData[locKey] || mockNewsData['default'], '📰');
            
            document.getElementById('right-sidebar').classList.remove('collapsed');
            document.getElementById('btn-toggle-sidebar').innerText = '▶';
        }

        function setupUIEventListeners() {
            document.getElementById('timeline-slider').oninput = (e) => {
                clearInterval(timelineTimer); isTimelinePlaying = false; document.getElementById('btn-timeline-play').innerText = '▶';
                filterEventsByTimeline(parseInt(e.target.value));
            };

            document.getElementById('btn-timeline-play').onclick = () => {
                const s = document.getElementById('timeline-slider');
                if (isTimelinePlaying) { clearInterval(timelineTimer); isTimelinePlaying = false; document.getElementById('btn-timeline-play').innerText = '▶'; } 
                else {
                    isTimelinePlaying = true; document.getElementById('btn-timeline-play').innerText = '❚❚';
                    if (s.value >= 100) s.value = 0;
                    timelineTimer = setInterval(() => { s.value = parseInt(s.value) + 1; filterEventsByTimeline(s.value); if(s.value >= 100) document.getElementById('btn-timeline-play').click(); }, 120);
                }
            };
            
            document.getElementById('btn-toggle-sidebar').onclick = function() {
                const sidebar = document.getElementById('right-sidebar');
                sidebar.classList.toggle('collapsed');
                this.innerText = sidebar.classList.contains('collapsed') ? '◀' : '▶';
            };
        }

        function updateDialogPosition() {
            if (currentIndex < 0 || !markerObjects[currentIndex]) return;
            const screenPos = markerObjects[currentIndex].pos.clone().project(camera);
            if (screenPos.z < 1) { 
                dialogCard.style.display = 'block';
                dialogCard.style.left = `${(screenPos.x*.5+.5)*window.innerWidth - 160}px`; 
                dialogCard.style.top = `${(-screenPos.y*.5+.5)*window.innerHeight - 170}px`; 
            } else dialogCard.style.display = 'none';
        }

        function animate() {
            requestAnimationFrame(animate);

            camera.position.lerp(targetCameraPos, 0.04);
            controls.update(); 

            markerObjects.forEach(m => {
                // 減少不必要的屬性更新，只在可見時計算
                if (m.ring1.visible) {
                    m.scale1 += 0.01; if (m.scale1 > 3.8) m.scale1 = 1.0;
                    m.ring1.scale.set(m.scale1, m.scale1, 1); m.ring1.material.opacity = Math.max(0, (3.8 - m.scale1) / 2.8);
                    m.scale2 += 0.01; if (m.scale2 > 3.8) m.scale2 = 1.0;
                    m.ring2.scale.set(m.scale2, m.scale2, 1); m.ring2.material.opacity = Math.max(0, (3.8 - m.scale2) / 2.8);
                }
                
                if (m.tsunamiRings) m.tsunamiRings.forEach(tw => { 
                    if(tw.mesh.visible) {
                        tw.scale += tw.speed; if (tw.scale > tw.maxScale) tw.scale = 1.0; 
                        tw.mesh.scale.set(tw.scale, tw.scale, 1); 
                        tw.mesh.material.opacity = Math.max(0, (tw.maxScale - tw.scale) / tw.maxScale) * 0.85; 
                    }
                });
            });

            updateDialogPosition();
            renderer.render(scene, camera);
        }

        // 確保 DOM 載入後再初始化 3D 引擎
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
