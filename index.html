        const stressNebulaCenters = [
            { lat: 35.0, lng: 140.0, count: 350, radiusDeg: 7.0 },
            { lat: 23.5, lng: 122.0, count: 300, radiusDeg: 5.5 },
            { lat: -8.0, lng: 115.0, count: 350, radiusDeg: 8.0 },
            { lat: -20.0, lng: -72.0, count: 300, radiusDeg: 7.0 },
            { lat: 15.0, lng: -95.0, count: 250, radiusDeg: 6.0 },
            { lat: -58.0, lng: -45.0, count: 200, radiusDeg: 7.0 }
        ];

        const RADIUS = 100;
        let scene, camera, renderer, controls, globeGroup;
        let markerObjects = [];
        let tsunamiWaveRings = [];
        let nebulaPointsMesh, nebulaPositions, nebulaBasePositions, nebulaCount;
        let wireframeMesh;
        let currentIndex = 0;
        let globalClock = 0;

        let showNebula = true;
        let showTsunami = true;
        let showSection = true;

        function latLngToVector3(lat, lng, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lng + 180) * (Math.PI / 180);
            return new THREE.Vector3(
                -radius * Math.sin(phi) * Math.cos(theta),
                radius * Math.cos(phi),
                radius * Math.sin(phi) * Math.sin(theta)
            );
        }

        // ==========================================
        // 核心效能優化：深度釋放 WebGL / GPU 資源
        // ==========================================
        function disposeObject(obj) {
            if (!obj) return;

            // 1. 釋放幾何體 Geometry
            if (obj.geometry) {
                obj.geometry.dispose();
            }

            // 2. 釋放材質 Material 與關聯的貼圖 Texture
            if (obj.material) {
                if (Array.isArray(obj.material)) {
                    obj.material.forEach(mat => disposeMaterial(mat));
                } else {
                    disposeMaterial(obj.material);
                }
            }

            // 3. 遞迴釋放子節點
            if (obj.children && obj.children.length > 0) {
                obj.children.forEach(child => disposeObject(child));
            }
        }

        function disposeMaterial(mat) {
            if (!mat) return;
            if (mat.map) mat.map.dispose();
            if (mat.bumpMap) mat.bumpMap.dispose();
            if (mat.specularMap) mat.specularMap.dispose();
            mat.dispose();
        }

        function createGlowPointTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 30);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.3, 'rgba(255, 255, 255, 0.8)');
            grad.addColorStop(0.7, 'rgba(255, 255, 255, 0.2)');
            grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        function createTextSprite(text, isPredict) {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = isPredict ? 'rgba(234, 179, 8, 0.95)' : 'rgba(239, 68, 68, 0.95)';
            ctx.font = 'bold 22px -apple-system, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = '#000';
            ctx.shadowBlur = 4;
            ctx.fillText(text, 64, 32);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(9, 4.5, 1);
            return sprite;
        }

        async function init() {
            applyLanguage();

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 30, 280);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 避免超高解析度過載
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 120;
            controls.maxDistance = 500;

            globeGroup = new THREE.Group();
            scene.add(globeGroup);

            const textureLoader = new THREE.TextureLoader();
            const earthTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
            const bumpTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-topology.png');

            const earthGeo = new THREE.SphereGeometry(RADIUS, 64, 64);
            const earthMat = new THREE.MeshPhongMaterial({ 
                map: earthTexture,
                bumpMap: bumpTexture,
                bumpScale: 1.5,
                specular: new THREE.Color('#1e293b'), 
                shininess: 15
            });
            const earthMesh = new THREE.Mesh(earthGeo, earthMat);
            globeGroup.add(earthMesh);

            const wireframeGeo = new THREE.IcosahedronGeometry(RADIUS * 1.04, 3);
            const wireframeMat = new THREE.MeshBasicMaterial({ color: 0x334155, wireframe: true, transparent: true, opacity: 0.16 });
            wireframeMesh = new THREE.Mesh(wireframeGeo, wireframeMat);
            globeGroup.add(wireframeMesh);

            const atmosphereGeo = new THREE.SphereGeometry(RADIUS * 1.015, 64, 64);
            const atmosphereMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.12, side: THREE.BackSide });
            globeGroup.add(new THREE.Mesh(atmosphereGeo, atmosphereMat));

            scene.add(new THREE.AmbientLight(0xffffff, 0.9));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(200, 100, 200);
            scene.add(dirLight);

            loadTectonicPlates();
            buildSpectralNebulaPointCloud();

            await refreshUSGSData();
            setInterval(refreshUSGSData, API_POLL_INTERVAL);

            setupUIEventListeners();
            window.addEventListener('resize', onWindowResize);
            
            filterEventsByTimeline(100);
            autoLocateUserTimezone();
            animate();

        function loadTectonicPlates() {
            fetch('https://raw.githubusercontent.com/fraxen/tectonicplates/master/GeoJSON/PB2002_boundaries.json')
                .then(res => res.json())
                .then(data => {
                    const material = new THREE.LineBasicMaterial({ color: 0x475569, transparent: true, opacity: 0.35, linewidth: 1 });
                    data.features.forEach(feature => {
                        const coords = feature.geometry.coordinates;
                        const points = [];
                        coords.forEach(coord => {
                            points.push(latLngToVector3(coord[1], coord[0], RADIUS + 0.4));
                        });
                        const geometry = new THREE.BufferGeometry().setFromPoints(points);
                        const line = new THREE.Line(geometry, material);
                        globeGroup.add(line);
                    });
                })
                .catch(err => console.log('Plate data error:', err));
        }

        function buildSpectralNebulaPointCloud() {
            let total = 0;
            stressNebulaCenters.forEach(c => total += c.count);
            nebulaCount = total;

            const positions = new Float32Array(total * 3);
            const basePositions = new Float32Array(total * 3);
            const colors = new Float32Array(total * 3);

            const palette = [
                new THREE.Color('#c084fc'),
                new THREE.Color('#f43f5e'),
                new THREE.Color('#fb923c'),
                new THREE.Color('#2dd4bf'),
                new THREE.Color('#38bdf8'),
                new THREE.Color('#e0e7ff')
            ];

            let pIdx = 0;
            stressNebulaCenters.forEach(center => {
                for (let i = 0; i < center.count; i++) {
                    const u = Math.random();
                    const v = Math.random();
                    const r = Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
                    const angle = Math.random() * Math.PI * 2;
                    
                    const dLat = (r * Math.cos(angle)) * (center.radiusDeg * 0.4);
                    const dLng = (r * Math.sin(angle)) * (center.radiusDeg * 0.4);
                    const altitude = RADIUS + 0.5 + Math.random() * 2.5;

                    const pos = latLngToVector3(center.lat + dLat, center.lng + dLng, altitude);

                    positions[pIdx * 3] = pos.x;
                    positions[pIdx * 3 + 1] = pos.y;
                    positions[pIdx * 3 + 2] = pos.z;

                    basePositions[pIdx * 3] = pos.x;
                    basePositions[pIdx * 3 + 1] = pos.y;
                    basePositions[pIdx * 3 + 2] = pos.z;

                    const col = palette[Math.floor(Math.random() * palette.length)].clone();
                    colors[pIdx * 3] = col.r;
                    colors[pIdx * 3 + 1] = col.g;
                    colors[pIdx * 3 + 2] = col.b;

                    pIdx++;
                }
            });

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 1.5,
                vertexColors: true,
                map: createGlowPointTexture(),
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.75,
                depthWrite: false
            });

            nebulaPointsMesh = new THREE.Points(geometry, material);
            nebulaPositions = positions;
            nebulaBasePositions = basePositions;
            globeGroup.add(nebulaPointsMesh);
        }

        async function refreshUSGSData() {
            try {
                const response = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_month.geojson');
                const data = await response.json();
                
                const predictItems = allEarthquakeData.filter(d => d.type === "predict");
                const realItems = [];

                data.features.forEach(eq => {
                    const mag = eq.properties.mag;
                    const lat = eq.geometry.coordinates[1];
                    const lng = eq.geometry.coordinates[0];
                    const depth = eq.geometry.coordinates[2];

                    if (mag >= 5.6 || (lat < -45 && mag >= 5.0)) {
                        const place = eq.properties.place;
                        const time = eq.properties.time;
                        const timeStr = new Date(time).toISOString().split('T')[0];
                        
                        realItems.push({
                            id: "usgs_" + eq.id,
                            type: "real",
                            timestamp: time,
                            date: timeStr + " (USGS)",
                            location: place,
                            lat: lat,
                            lng: lng,
                            mag: "M " + mag.toFixed(1),
                            depth: Math.round(depth),
                            dipAngle: Math.floor(20 + Math.random() * 25),
                            isOceanic: Math.abs(lat) < 55 && depth < 60,
                            desc: `USGS: [${lat.toFixed(2)}, ${lng.toFixed(2)}], ${lang.depthLabel} ${depth} km.`
                        });
                    }
                });

                realItems.sort((a, b) => a.timestamp - b.timestamp);
                allEarthquakeData = [...predictItems, ...realItems];

                document.getElementById('sync-status').innerText = `${lang.synced} (${allEarthquakeData.length})`;
                filterEventsByTimeline(parseInt(document.getElementById('timeline-slider').value));
            } catch (e) {
                console.log("USGS API Fallback", e);
                document.getElementById('sync-status').innerText = 'USGS Offline';
            }
        }

        function filterEventsByTimeline(percentage) {
            if (allEarthquakeData.length === 0) return;
            const predicts = allEarthquakeData.filter(e => e.type === 'predict');
            const reals = allEarthquakeData.filter(e => e.type === 'real');

            let activeEvents = [...predicts];

            if (reals.length > 0) {
                const minTime = reals[0].timestamp;
                const maxTime = reals[reals.length - 1].timestamp;
                const cutoffTime = minTime + (maxTime - minTime) * (percentage / 100);
                const filteredReals = reals.filter(e => e.timestamp <= cutoffTime);
                activeEvents = [...predicts, ...filteredReals];

                document.getElementById('lbl-timeline-date').innerText = percentage >= 100 ? lang.allTime : new Date(cutoffTime).toISOString().split('T')[0];
            }

            document.getElementById('lbl-event-count').innerText = activeEvents.length;
            rebuildMarkersAndControls(activeEvents);
        }

        function rebuildMarkersAndControls(activeEvents) {
            // ==========================================
            // 執行深度顯存釋放，徹底防止記憶體堆積
            // ==========================================
            markerObjects.forEach(m => {
                globeGroup.remove(m.dot);
                globeGroup.remove(m.ring1);
                globeGroup.remove(m.ring2);
                globeGroup.remove(m.sprite);

                disposeObject(m.dot);
                disposeObject(m.ring1);
                disposeObject(m.ring2);
                disposeObject(m.sprite);
            });

            tsunamiWaveRings.forEach(tw => {
                globeGroup.remove(tw.mesh);
                disposeObject(tw.mesh);
            });

            markerObjects = [];
            tsunamiWaveRings = [];

            activeEvents.forEach((eq) => {
                const pos = latLngToVector3(eq.lat, eq.lng, RADIUS + 0.8);
                const isPredict = eq.type === 'predict';
                const color = isPredict ? 0xeab308 : 0xef4444;

                const dotGeo = new THREE.SphereGeometry(0.7, 12, 12);
                const dotMat = new THREE.MeshBasicMaterial({ color: color });
                const dotMesh = new THREE.Mesh(dotGeo, dotMat);
                dotMesh.position.copy(pos);

                const ringGeo = new THREE.RingGeometry(1.2, 1.45, 32);
                const ringMat1 = new THREE.MeshBasicMaterial({ color: color, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
                const ringMesh1 = new THREE.Mesh(ringGeo, ringMat1);
                ringMesh1.position.copy(pos);
                ringMesh1.lookAt(new THREE.Vector3(0, 0, 0));

                const ringMat2 = new THREE.MeshBasicMaterial({ color: color, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
                const ringMesh2 = new THREE.Mesh(ringGeo.clone(), ringMat2);
                ringMesh2.position.copy(pos);
                ringMesh2.lookAt(new THREE.Vector3(0, 0, 0));

                const sprite = createTextSprite(eq.mag, isPredict);
                const textPos = latLngToVector3(eq.lat, eq.lng, RADIUS + 4.2);
                sprite.position.copy(textPos);

                globeGroup.add(dotMesh);
                globeGroup.add(ringMesh1);
                globeGroup.add(ringMesh2);
                globeGroup.add(sprite);

                const numMag = parseFloat(eq.mag.replace(/[^0-9.]/g, ''));
                if (eq.isOceanic && numMag >= 7.0 && eq.depth < 70) {
                    for (let w = 0; w < 3; w++) {
                        const tGeo = new THREE.RingGeometry(2.0, 2.5, 48);
                        const tMat = new THREE.MeshBasicMaterial({ color: 0x06b6d4, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
                        const tMesh = new THREE.Mesh(tGeo, tMat);
                        tMesh.position.copy(pos);
                        tMesh.lookAt(new THREE.Vector3(0, 0, 0));
                        tMesh.visible = showTsunami;
                        globeGroup.add(tMesh);

                        tsunamiWaveRings.push({
                            mesh: tMesh,
                            scale: 1.0 + w * 3.5,
                            speed: 0.025,
                            maxScale: 14.0
                        });
                    }
                }

                markerObjects.push({
                    dot: dotMesh,
                    ring1: ringMesh1,
                    ring2: ringMesh2,
                    sprite: sprite,
                    pos: pos,
                    data: eq,
                    scale1: 1.0,
                    scale2: 2.4
                });
            });

            const bar = document.getElementById('events-btn-container');
            bar.innerHTML = '';
            activeEvents.forEach((eq, idx) => {
                const btn = document.createElement('button');
                btn.className = `btn-step ${eq.type === 'predict' ? 'predict-btn' : ''}`;
                btn.id = `btn-step-${idx}`;
                const shortName = eq.location.split(',')[0].split(' of ')[1] || eq.location.split(' ')[0];
                btn.innerText = `${idx + 1}. ${eq.type === 'predict' ? lang.predictPrefix : ''}${shortName}`;
                btn.onclick = () => { focusEvent(idx); };
                bar.appendChild(btn);
            });
        }

        function drawCrossSection(data) {
            if (!showSection) return;
            const w = sectionCanvas.width;
            const h = sectionCanvas.height;
            sCtx.clearRect(0, 0, w, h);

            const bgGrad = sCtx.createLinearGradient(0, 0, 0, h);
            bgGrad.addColorStop(0, "#0c1527");
            bgGrad.addColorStop(0.5, "#172554");
            bgGrad.addColorStop(1, "#020617");
            sCtx.fillStyle = bgGrad;
            sCtx.fillRect(0, 0, w, h);

            if (data.isOceanic) {
                sCtx.fillStyle = "rgba(6, 182, 212, 0.35)";
                sCtx.fillRect(0, 0, w * 0.55, 14);
                sCtx.fillStyle = "#38bdf8";
                sCtx.font = "9px sans-serif";
                sCtx.fillText("Sea Level", 10, 10);
            }

            const dip = (data.dipAngle || 30) * (Math.PI / 180);

            sCtx.beginPath();
            sCtx.moveTo(0, 15);
            sCtx.lineTo(w * 0.45, 15);
            sCtx.lineTo(w * 0.9, h - 10);
            sCtx.lineTo(w * 0.8, h);
            sCtx.lineTo(w * 0.35, 35);
            sCtx.lineTo(0, 35);
            sCtx.closePath();
            sCtx.fillStyle = "rgba(56, 189, 248, 0.25)";
            sCtx.fill();
            sCtx.strokeStyle = "#38bdf8";
            sCtx.lineWidth = 1.5;
            sCtx.stroke();

            sCtx.beginPath();
            sCtx.moveTo(w * 0.48, 15);
            sCtx.lineTo(w, 15);
            sCtx.lineTo(w, h - 20);
            sCtx.lineTo(w * 0.92, h - 10);
            sCtx.closePath();
            sCtx.fillStyle = "rgba(249, 115, 22, 0.18)";
            sCtx.fill();
            sCtx.strokeStyle = "#f97316";
            sCtx.lineWidth = 1.5;
            sCtx.stroke();

            sCtx.setLineDash([4, 4]);
            sCtx.strokeStyle = "rgba(148, 163, 184, 0.5)";
            sCtx.beginPath();
            sCtx.moveTo(w * 0.5, 40);
            sCtx.lineTo(w, 40);
            sCtx.stroke();
            sCtx.setLineDash([]);

            sCtx.fillStyle = "#94a3b8";
            sCtx.font = "9px sans-serif";
            sCtx.fillText("Moho", w - 45, 36);

            const focusX = w * 0.45 + (data.depth / 150) * (w * 0.35);
            const focusY = 15 + Math.sin(dip) * (data.depth * 0.8);

            sCtx.fillStyle = data.type === 'predict' ? "#eab308" : "#ef4444";
            sCtx.beginPath();
            sCtx.arc(focusX, Math.min(focusY, h - 25), 5, 0, Math.PI * 2);
            sCtx.fill();

            sCtx.fillStyle = "#fff";
            sCtx.font = "bold 10px sans-serif";
            sCtx.fillText(`★ ${data.depth} km`, focusX - 20, Math.min(focusY, h - 25) - 10);

            document.getElementById('hud-subduction-angle').innerText = `Dip: ${data.dipAngle || 28}°`;
            document.getElementById('hud-section-note').innerText = 
                `${data.location} | ${lang.depthLabel} ${data.depth} km.`;
        }

        function focusEvent(index) {
            if (!markerObjects[index]) return;
            currentIndex = index;
            const target = markerObjects[index];

            document.querySelectorAll('.btn-step').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-step-${index}`);
            if (activeBtn) activeBtn.classList.add('active');

            targetRotationY = -target.data.lng * (Math.PI / 180) - (Math.PI / 2);
            targetRotationX = target.data.lat * (Math.PI / 180);

            const badge = document.getElementById('c-badge');
            if (target.data.type === 'predict') {
                badge.className = 'badge-type predict';
                badge.innerText = lang.badgePredict;
            } else {
                badge.className = 'badge-type real';
                badge.innerText = lang.badgeReal;
            }

            const tsunamiBadge = document.getElementById('c-tsunami-badge');
            const numMag = parseFloat(target.data.mag.replace(/[^0-9.]/g, ''));
            if (target.data.isOceanic && numMag >= 7.0 && target.data.depth < 70) {
                tsunamiBadge.style.display = 'inline-block';
                tsunamiBadge.innerText = lang.badgeTsunami;
            } else {
                tsunamiBadge.style.display = 'none';
            }

            document.getElementById('c-title').innerText = target.data.location;
            document.getElementById('c-date').innerText = target.data.date;
            document.getElementById('c-mag').innerText = target.data.mag;
            document.getElementById('c-depth').innerText = `${lang.depthLabel} ${target.data.depth} km`;
            document.getElementById('c-desc').innerText = target.data.desc;

            dialogCard.style.display = 'block';
            dialogCard.style.opacity = '1';

            drawCrossSection(target.data);
        }

        function setupUIEventListeners() {
            const slider = document.getElementById('timeline-slider');
            slider.oninput = (e) => {
                stopTimelinePlay();
                filterEventsByTimeline(parseInt(e.target.value));
            };

            const playBtn = document.getElementById('btn-timeline-play');
            playBtn.onclick = () => {
                if (isTimelinePlaying) {
                    stopTimelinePlay();
                } else {
                    startTimelinePlay();
                }
            };

            document.getElementById('btn-toggle-nebula').onclick = function() {
                showNebula = !showNebula;
                this.classList.toggle('active', showNebula);
                if (nebulaPointsMesh) nebulaPointsMesh.visible = showNebula;
            };

            document.getElementById('btn-toggle-tsunami').onclick = function() {
                showTsunami = !showTsunami;
                this.classList.toggle('active', showTsunami);
                tsunamiWaveRings.forEach(tw => tw.mesh.visible = showTsunami);
            };

            document.getElementById('btn-toggle-section').onclick = function() {
                showSection = !showSection;
                this.classList.toggle('active', showSection);
                document.getElementById('cross-section-panel').style.display = showSection ? 'block' : 'none';
                if (showSection && markerObjects[currentIndex]) {
                    drawCrossSection(markerObjects[currentIndex].data);
                }
            };

            document.getElementById('cross-section-panel').style.display = 'block';
        }

        function startTimelinePlay() {
            isTimelinePlaying = true;
            document.getElementById('btn-timeline-play').innerText = '❚❚';
            const slider = document.getElementById('timeline-slider');
            
            if (parseInt(slider.value) >= 100) slider.value = 0;

            timelineTimer = setInterval(() => {
                let val = parseInt(slider.value) + 1;
                if (val > 100) {
                    stopTimelinePlay();
                } else {
                    slider.value = val;
                    filterEventsByTimeline(val);
                }
            }, 120);
        }

        function stopTimelinePlay() {
            isTimelinePlaying = false;
            document.getElementById('btn-timeline-play').innerText = '▶';
            clearInterval(timelineTimer);
        }

        let targetRotationY = 0;
        let targetRotationX = 0;

        function updateDialogPosition() {
            if (markerObjects.length === 0 || !markerObjects[currentIndex]) return;
            const currentMarker = markerObjects[currentIndex];
            const worldPos = currentMarker.pos.clone().applyMatrix4(globeGroup.matrixWorld);
            const screenPos = worldPos.project(camera);
            const x = (screenPos.x * .5 + .5) * window.innerWidth;
            const y = (-(screenPos.y * .5) + .5) * window.innerHeight;

            if (screenPos.z < 0.98) {
                dialogCard.style.display = 'block';
                dialogCard.style.left = `${x - 155}px`;
                dialogCard.style.top = `${y - 175}px`;
            } else {
                dialogCard.style.display = 'none';
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            globalClock += 0.03;

            globeGroup.rotation.y += (targetRotationY - globeGroup.rotation.y) * 0.04;
            globeGroup.rotation.x += (targetRotationX - globeGroup.rotation.x) * 0.04;

            markerObjects.forEach(m => {
                m.scale1 += 0.01;
                if (m.scale1 > 3.8) m.scale1 = 1.0;
                m.ring1.scale.set(m.scale1, m.scale1, 1);
                m.ring1.material.opacity = Math.max(0, (3.8 - m.scale1) / 2.8);

                m.scale2 += 0.01;
                if (m.scale2 > 3.8) m.scale2 = 1.0;
                m.ring2.scale.set(m.scale2, m.scale2, 1);
                m.ring2.material.opacity = Math.max(0, (3.8 - m.scale2) / 2.8);
            });

            if (showTsunami) {
                tsunamiWaveRings.forEach(tw => {
                    tw.scale += tw.speed;
                    if (tw.scale > tw.maxScale) tw.scale = 1.0;
                    tw.mesh.scale.set(tw.scale, tw.scale, 1);
                    tw.mesh.material.opacity = Math.max(0, (tw.maxScale - tw.scale) / tw.maxScale) * 0.85;
                });
            }

            if (showNebula && nebulaPointsMesh && nebulaPositions) {
                for (let i = 0; i < nebulaCount; i++) {
                    const i3 = i * 3;
                    const bx = nebulaBasePositions[i3];
                    const by = nebulaBasePositions[i3 + 1];
                    const bz = nebulaBasePositions[i3 + 2];

                    const noise = Math.sin(globalClock * 1.5 + i * 0.1) * 0.4;
                    nebulaPositions[i3] = bx + (bx / RADIUS) * noise;
                    nebulaPositions[i3 + 1] = by + (by / RADIUS) * noise;
                    nebulaPositions[i3 + 2] = bz + (bz / RADIUS) * noise;
                }
                nebulaPointsMesh.geometry.attributes.position.needsUpdate = true;
            }

            controls.update();
            updateDialogPosition();
            renderer.render(scene, camera);
        }

        const timezoneCoordsMap = {
            "Asia/Taipei": { lat: 23.69, lng: 120.96 },
            "Asia/Tokyo": { lat: 35.68, lng: 139.76 },
            "Asia/Shanghai": { lat: 31.23, lng: 121.47 },
            "America/New_York": { lat: 40.71, lng: -74.00 },
            "America/Los_Angeles": { lat: 34.05, lng: -118.24 },
            "Europe/London": { lat: 51.50, lng: -0.12 },
            "Australia/Sydney": { lat: -33.86, lng: 151.20 }
        };

        function autoLocateUserTimezone() {
            const userTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            let targetLat = 23.69;
            let targetLng = 120.96;

            if (timezoneCoordsMap[userTimezone]) {
                targetLat = timezoneCoordsMap[userTimezone].lat;
                targetLng = timezoneCoordsMap[userTimezone].lng;
            }

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => { focusOnCoordinates(pos.coords.latitude, pos.coords.longitude); },
                    () => { focusOnCoordinates(targetLat, targetLng); },
                    { timeout: 3000 }
                );
            } else {
                focusOnCoordinates(targetLat, targetLng);
            }
        }

        function focusOnCoordinates(lat, lng) {
            targetRotationY = -lng * (Math.PI / 180) - (Math.PI / 2);
            targetRotationX = lat * (Math.PI / 180);

            let closestIdx = 0;
            let minDistance = Infinity;

            allEarthquakeData.forEach((eq, idx) => {
                const d = Math.hypot(eq.lat - lat, eq.lng - lng);
                if (d < minDistance) {
                    minDistance = d;
                    closestIdx = idx;
                }
            });

            setTimeout(() => {
                const targetBtn = document.getElementById(`btn-step-${closestIdx}`);
                if (targetBtn) {
                    targetBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                    focusEvent(closestIdx);
                }
            }, 800);
        }

        init();
    </script>
