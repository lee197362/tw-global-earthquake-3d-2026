    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const API_POLL_INTERVAL = 300000;

        let allEarthquakeData = [
            {
                id: "p1", type: "predict",
                timestamp: new Date("2026-12-31").getTime(),

            },
            {
                id: "r1", type: "real",
                timestamp: new Date("2026-08-14").getTime(),
                date: "2026/08/14",
                location: "印尼 弗洛勒斯海",

            },
            {
                id: "r3", type: "real",
                timestamp: new Date("2026-06-07").getTime(),

                location: "菲律賓 棉蘭老島西南外海",
                lat: 5.92, lng: 124.95,
                mag: "M 7.8", depth: 57,

            }
        ];

        // 構造動力學：向量移動流聚集中心與速度 (cm/yr)
        const tectonicVelocityCenters = [
            { lat: 24.0, lng: 122.5, count: 60, radiusDeg: 6.0, speed: 7.8, heading: 310, color: 0xef4444 }, // 台灣隠沒擠壓 (紅箭頭)
            { lat: 35.0, lng: 141.0, count: 60, radiusDeg: 6.0, speed: 8.2, heading: 300, color: 0xef4444 }, // 日本隱沒擠壓 (紅箭頭)
            { lat: 0.0, lng: -28.0, count: 40, radiusDeg: 12.0, speed: 2.5, heading: 90, color: 0xeab308 }, // 中大西洋洋脊張裂 (黃箭頭)
            { lat: -25.0, lng: -112.0, count: 50, radiusDeg: 10.0, speed: 12.0, heading: 275, color: 0x06b6d4 } // 東太平洋洋脊走向滑移 (青箭頭)
        ];

        // 仿真 Webcams 開放資料 (依照區域反查)
        const mockWebcamData = {
            "r1": [
                { title: "弗洛勒斯港口監測 1", time: "2分鐘前", type: "港口監視網" },
                { title: "NIED 印尼震動觀測站", time: "1分鐘前", type: "專業儀器台" }
            ],
            "p1": [
                { title: "CWB 宜蘭外海 1 (N)", time: "5分鐘前", type: "海洋監測網" },
                { title: "CWB 台東外海 3 (E)", time: "即時", type: "海洋監測網" },
                { title: "NIED 日本沖繩與那國島監測", time: "2分鐘前", type: "防災監視網" }
            ]
        };

        const RADIUS = 100;
        let scene, camera, renderer, controls, globeGroup;
        let markerObjects = [];
        let plateVelocityGroup; // 板塊相對移動向量流圖層
        let stressFieldGroup; // 月球引力應力梯度場圖層
        let tsunamiWaveRings = [];
        let wireframeMesh;
        let nebulaPointsMesh, nebulaPositions, nebulaBasePositions, nebulaCount;
        let currentIndex = 0;
        let globalClock = 0;

        let isTimelinePlaying = false;
        let timelineTimer = null;
        let targetCameraDist = 280;

        let showPlates = true;
        let showStress = true;
        let showWebcams = false;
        let showNews = false;

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        const container = document.getElementById('webgl-container');
        const dialogCard = document.getElementById('dialog-card');
        const sectionPanel = document.getElementById('cross-section-panel');
        const sectionCanvas = document.getElementById('section-canvas');
        const sCtx = sectionCanvas.getContext('2d');

        function latLngToVector3(lat, lng, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lng + 180) * (Math.PI / 180);
            return new THREE.Vector3(
                -radius * Math.sin(phi) * Math.cos(theta),
                radius * Math.cos(phi),
                radius * Math.sin(phi) * Math.sin(theta)
            );
        }

        // 產生圓點貼圖
        function createPointTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 30);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.3, 'rgba(255, 255, 255, 0.8)');
            grad.addColorStop(0.7, 'rgba(255, 255, 255, 0.2)');
            grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        // 產生震級文字 Sprite
        function createTextSprite(text, isPredict) {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = isPredict ? 'rgba(234, 179, 8, 0.95)' : 'rgba(239, 68, 68, 0.95)';
            ctx.font = 'bold 22px -apple-system, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
            ctx.fillText(text, 64, 32);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(9, 4.5, 1);
            return sprite;
        }

        // 建立 3D 向量箭頭陣列 (強化地質學質感)
        function create3DVelocityArrow(ptSurface, ptEnd, color, speed) {
            const group = new THREE.Group();
            
            // 箭頭桿
            const stemPoints = [];
            stemPoints.push(ptSurface);
            stemPoints.push(ptEnd);
            const stemGeo = new THREE.BufferGeometry().setFromPoints(stemPoints);
            const stemMat = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.8, linewidth: 2 });
            const stem = new THREE.Line(stemGeo, stemMat);
            group.add(stem);

            // 箭頭頭 (簡易錐形)
            const headSize = Math.min(speed / 12, 1.0);
            const headGeo = new THREE.ConeGeometry(headSize * 0.4, headSize, 8);
            const headMat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.9 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.copy(ptEnd);
            head.lookAt(ptSurface);
            head.rotateX(Math.PI / 2);
            group.add(head);

            return group;
        }

        async function init() {
            applyLanguage();

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 30, 280);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.dampingFactor = 0.05;
            controls.minDistance = 120; controls.maxDistance = 500;

            globeGroup = new THREE.Group();
            scene.add(globeGroup);

            // 地球本體材質與外骨骼線網
            const textureLoader = new THREE.TextureLoader();
            const earthTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
            const bumpTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-topology.png');

            const earthGeo = new THREE.SphereGeometry(RADIUS, 64, 64);
            const earthMat = new THREE.MeshPhongMaterial({ map: earthTexture, bumpMap: bumpTexture, bumpScale: 1.5, specular: new THREE.Color('#1e293b'), shininess: 15 });
            const earthMesh = new THREE.Mesh(earthGeo, earthMat);
            earthMesh.userData = { isGlobe: true };
            globeGroup.add(earthMesh);

            const wireframeGeo = new THREE.IcosahedronGeometry(RADIUS * 1.04, 3);
            const wireframeMat = new THREE.MeshBasicMaterial({ color: 0x334155, wireframe: true, transparent: true, opacity: 0.16 });
            wireframeMesh = new THREE.Mesh(wireframeGeo, wireframeMat);
            globeGroup.add(wireframeMesh);

            const atmosphereGeo = new THREE.SphereGeometry(RADIUS * 1.015, 64, 64);
            const atmosphereMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.12, side: THREE.BackSide });
            globeGroup.add(new THREE.Mesh(atmosphereGeo, atmosphereMat));

            scene.add(new THREE.AmbientLight(0xffffff, 0.9));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(200, 100, 200);
            scene.add(dirLight);

            loadTectonicPlates();
            buildSpectralNebulaPointCloud();
            buildPlateVelocityGroup(); // 建立板塊移動向量圖層 (本次新增)
            buildStressFieldGroup(); // 建立月球固體潮應力梯度場圖層 (本次新增)

            await refreshUSGSData();
            setInterval(refreshUSGSData, API_POLL_INTERVAL);

            setupUIEventListeners();
            setupRaycasterListeners(); // 啟用 3D 拾取 Webcams/News

            window.addEventListener('resize', onWindowResize);
            filterEventsByTimeline(100);
            autoLocateUserTimezone();
            animate();
        }

        // ==========================================
        // 本次新增功能的專業實作 (Tectonic & Stress)
        // ==========================================
        function buildPlateVelocityGroup() {
            plateVelocityGroup = new THREE.Group();
            globeGroup.add(plateVelocityGroup);

            tectonicVelocityCenters.forEach(center => {
                const headRad = center.heading * (Math.PI / 180);
                for (let i = 0; i < center.count; i++) {
                    const dLat = (Math.random() - 0.5) * (center.radiusDeg * 1.6);
                    const dLng = (Math.random() - 0.5) * (center.radiusDeg * 1.6);
                    const ptSurface = latLngToVector3(center.lat + dLat, center.lng + dLng, RADIUS + 0.6);

                    // 依照方向與速度演算箭頭終點
                    const arrowLen = Math.min(center.speed / 4, 3.0);
                    const ptEnd = ptSurface.clone().normalize().multiplyScalar(RADIUS + 0.6 + arrowLen);
                    
                    const arrowMesh = create3DVelocityArrow(ptSurface, ptEnd, center.color, center.speed);
                    plateVelocityGroup.add(arrowMesh);
                }
            });
            plateVelocityGroup.visible = showPlates;
        }

        function buildStressFieldGroup() {
            stressFieldGroup = new THREE.Group();
            globeGroup.add(stressFieldGroup);

            const palette = [new THREE.Color('#e0e7ff'), new THREE.Color('#c084fc'), new THREE.Color('#38bdf8')];

        function setupRaycasterListeners() {
            let pointerDownTime = 0;
            let startX = 0, startY = 0;

            window.addEventListener('pointerdown', (e) => {
                pointerDownTime = Date.now();
                startX = e.clientX; startY = e.clientY;
            });

            window.addEventListener('pointermove', (e) => {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(clickableHitTargets);
                if (intersects.length > 0) {
                    document.body.style.cursor = 'pointer';
                } else {
                    document.body.style.cursor = 'default';
                }
            });

            window.addEventListener('pointerup', (e) => {
                const clickDuration = Date.now() - pointerDownTime;
                const distMoved = Math.hypot(e.clientX - startX, e.clientY - startY);

                // 點擊事件 (短暫且無顯著移動)
                if (clickDuration < 300 && distMoved < 8) {
                    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(clickableHitTargets);

                    if (intersects.length > 0) {
                        const targetData = intersects[0].object.userData;
                        if (targetData.isEarthquake) {
                            focusEvent(targetData.eventIndex, true, true);
                        }
                    } else {
                        // 點擊地球非事件區域也可觸發 (例如拾取板塊邊界，未來擴充)
                        raycaster.intersectObject(globeGroup.children.find(c => c.userData.isGlobe)).length > 0;
                    }
                }
            });
        }

        function handleDeepLinkRouting() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetId = urlParams.get('id');
            const paramLat = parseFloat(urlParams.get('lat'));
            const paramLng = parseFloat(urlParams.get('lng'));

            if (targetId) {
                const foundIdx = allEarthquakeData.findIndex(e => e.id === targetId);
                if (foundIdx !== -1) {
                    setTimeout(() => {
                        const targetBtn = document.getElementById(`btn-step-${foundIdx}`);
                        if (targetBtn) targetBtn.scrollIntoView({ behavior: 'smooth', inline: 'center' });
                        focusEvent(foundIdx, false, true);
                    }, 600);
                    return;
                }
            }
            if (!isNaN(paramLat) && !isNaN(paramLng)) { targetRotationY = -paramLng * (Math.PI / 180) - (Math.PI / 2); targetRotationX = paramLat * (Math.PI / 180); } else { autoLocateUserTimezone(); }
        }

        function onWindowResize() { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }

        function animate() {
            requestAnimationFrame(animate);
            globalClock += 0.03;

            globeGroup.rotation.y += (targetRotationY - globeGroup.rotation.y) * 0.05;
            globeGroup.rotation.x += (targetRotationX - globeGroup.rotation.x) * 0.05;
            camera.position.z += (targetCameraDist - camera.position.z) * 0.05;

            markerObjects.forEach(m => {
                m.scale1 += 0.01; if (m.scale1 > 3.8) m.scale1 = 1.0;
                m.ring1.scale.set(m.scale1, m.scale1, 1);
                m.ring1.material.opacity = Math.max(0, (3.8 - m.scale1) / 2.8);
                m.scale2 += 0.01; if (m.scale2 > 3.8) m.scale2 = 1.0;
                m.ring2.scale.set(m.scale2, m.scale2, 1);
                m.ring2.material.opacity = Math.max(0, (3.8 - m.scale2) / 2.8);
            });

            if (showTsunami) { tsunamiWaveRings.forEach(tw => { tw.scale += tw.speed; if (tw.scale > tw.maxScale) tw.scale = 1.0; tw.mesh.scale.set(tw.scale, tw.scale, 1); tw.mesh.material.opacity = Math.max(0, (tw.maxScale - tw.scale) / tw.maxScale) * 0.85; }); }

            // 月球應力梯度場閃爍 (呼吸質感)
            if (showStress && stressFieldGroup) {
                const breathing = 0.35 + Math.sin(globalClock * 2) * 0.1;
                stressFieldGroup.children.forEach(points => {
                    points.material.opacity = breathing;
                });
            }

            // 多光譜星雲微擾動
            if (nebulaPointsMesh && nebulaPositions) {
                for (let i = 0; i < nebulaCount; i++) {
                    const i3 = i * 3;
                    const bx = nebulaBasePositions[i3];
                    const by = nebulaBasePositions[i3 + 1];
                    const bz = nebulaBasePositions[i3 + 2];
                    const noise = Math.sin(globalClock * 1.5 + i * 0.1) * 0.4;
                    nebulaPositions[i3] = bx + (bx / RADIUS) * noise;
                    nebulaPositions[i3 + 1] = by + (by / RADIUS) * noise;
                    nebulaPositions[i3 + 2] = bz + (bz / RADIUS) * noise;
                }
                nebulaPointsMesh.geometry.attributes.position.needsUpdate = true;
            }

            controls.update();
            updateDialogPosition();
            renderer.render(scene, camera);
        }

        function updateDialogPosition() {
            if (markerObjects.length === 0 || !markerObjects[currentIndex]) return;
            const currentMarker = markerObjects[currentIndex];
            const worldPos = currentMarker.pos.clone().applyMatrix4(globeGroup.matrixWorld);
            const screenPos = worldPos.project(camera);
            const x = (screenPos.x * .5 + .5) * window.innerWidth;
            const y = (-(screenPos.y * .5) + .5) * window.innerHeight;
            if (screenPos.z < 0.98) { dialogCard.style.display = 'block'; dialogCard.style.left = `${x - 155}px`; dialogCard.style.top = `${y - 175}px`; } else { dialogCard.style.display = 'none'; }
        }

        init();
    </script>
</body>
</html>
