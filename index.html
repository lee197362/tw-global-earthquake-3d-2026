<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球板塊構造應力場與即時地震監測 (多光譜粒子星雲版)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #020617; 
            color: #f3f4f6; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            overflow: hidden; 
        }
        #webgl-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .header {
            position: absolute;
            top: 24px;
            left: 28px;
            z-index: 10;
            pointer-events: none;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #38bdf8;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }
        .header p {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }
        .sync-status {
            display: inline-block;
            margin-top: 6px;
            font-size: 11px;
            color: #4ade80;
            background: rgba(34, 197, 94, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .legend-panel {
            position: absolute;
            top: 24px;
            right: 28px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(56, 189, 248, 0.3);
            backdrop-filter: blur(8px);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 12px;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .legend-item:last-child { margin-bottom: 0; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot.real { border: 1.5px solid #ef4444; background: transparent; }
        .dot.predict { border: 1.5px solid #eab308; background: transparent; }
        .dot.nebula { background: linear-gradient(135deg, #ec4899, #06b6d4); box-shadow: 0 0 8px #06b6d4; }

        #dialog-card {
            position: absolute;
            z-index: 20;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(56, 189, 248, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 16px 20px;
            width: 320px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
            display: none;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .badge-type {
            font-size: 10px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 6px;
        }
        .badge-type.real { background: #ef4444; color: #fff; }
        .badge-type.predict { background: #eab308; color: #0f172a; }

        .card-title { font-size: 15px; font-weight: bold; color: #fff; margin-bottom: 6px; }
        .card-meta { font-size: 12px; color: #38bdf8; margin-bottom: 6px; display: flex; gap: 10px; flex-wrap: wrap; }
        .card-desc { font-size: 11px; color: #cbd5e1; line-height: 1.4; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 6px; }

        .timeline-bar {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 90vw;
            overflow-x: auto;
        }
        .btn-step {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 11px;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .btn-step:hover { background: #38bdf8; color: #0f172a; font-weight: bold; }
        .btn-step.active { background: #f97316; border-color: #f97316; color: #fff; font-weight: bold; }
        .btn-step.predict-btn { border-color: #eab308; color: #eab308; }
        .btn-step.predict-btn.active { background: #eab308; color: #0f172a; }
    </style>
</head>
<body>

    <div class="header">
        <h1>全球板塊構造應力場與即時地震監測</h1>
        <p>多光譜 GPU 點雲星雲粒場 · 科技幾何外骨骼 · 鏤空波紋與芮氏數值</p>
        <div class="sync-status" id="sync-status">USGS 即時資料載入中...</div>
    </div>

    <div class="legend-panel">
        <div class="legend-item"><div class="dot real"></div><span>實際發生地震 (中空波紋 + 數值)</span></div>
        <div class="legend-item"><div class="dot predict"></div><span>科學預測高風險區 (評估數值)</span></div>
        <div class="legend-item"><div class="dot nebula"></div><span>多光譜應力微粒雲 (GPU Points)</span></div>
    </div>

    <div id="dialog-card">
        <span class="badge-type real" id="c-badge">實際發生</span>
        <div class="card-title" id="c-title">載入中...</div>
        <div class="card-meta">
            <span id="c-date">--</span>
            <span id="c-mag">--</span>
            <span id="c-depth">--</span>
        </div>
        <div class="card-desc" id="c-desc">--</div>
    </div>

    <div class="timeline-bar" id="timeline-controls">
        <button class="btn-step" id="btn-auto">自動導覽</button>
    </div>

    <div id="webgl-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const API_POLL_INTERVAL = 300000;

        let allEarthquakeData = [
            {
                id: "p1", type: "predict",
                date: "預測視窗：2026 Q3-Q4",
                location: "台灣東部外海 (琉球海溝段)",
                lat: 23.8, lng: 122.5,
                mag: "M 7.2", depth: "15-30 km",
                desc: "菲律賓海板塊持續朝西北向隱沒擠壓歐亞板塊，應力累積鎖定顯著。"
            },
            {
                id: "p2", type: "predict",
                date: "預測視窗：2026 下半年",
                location: "南美洲 中段隱沒帶 (祕魯/智利交界)",
                lat: -18.5, lng: -70.3,
                mag: "M 7.5", depth: "35 km",
                desc: "納斯卡板塊東向隱沒擠壓南美板塊，歷史破裂週期窗口逼近。"
            },
            {
                id: "r1", type: "real",
                date: "2026/08/14",
                location: "印尼 弗洛勒斯海",
                lat: -7.60, lng: 121.90,
                mag: "M 7.7", depth: "10 km",
                desc: "弗洛勒斯逆衝帶淺層破裂，澳洲板塊朝巽他板塊隱沒前緣擠壓。"
            },
            {
                id: "r2", type: "real",
                date: "2026/08/10",
                location: "哥倫比亞 喬科省",
                lat: 4.90, lng: -76.60,
                mag: "M 7.4", depth: "110 km",
                desc: "納斯卡板塊俯衝至南美板塊下方的中深層板塊拉張撕裂。"
            },
            {
                id: "r3", type: "real",
                date: "2026/06/07",
                location: "菲律賓 棉蘭老島西南外海",
                lat: 5.92, lng: 124.95,
                mag: "M 7.8", depth: "57 km",
                desc: "哥塔巴托海溝隱沒帶與菲律賓移動帶板塊交界面強烈擠壓。"
            }
        ];

        // 應力星雲斷層聚集中心點
        const stressNebulaCenters = [
            { lat: 35.0, lng: 140.0, count: 400, radiusDeg: 7.0 }, // 日本海溝
            { lat: 23.5, lng: 122.0, count: 350, radiusDeg: 5.5 }, // 台灣-琉球
            { lat: -8.0, lng: 115.0, count: 400, radiusDeg: 8.0 }, // 印尼爪哇
            { lat: -20.0, lng: -72.0, count: 350, radiusDeg: 7.0 }, // 南美智利
            { lat: 15.0, lng: -95.0, count: 300, radiusDeg: 6.0 },  // 中美洲海溝
            { lat: -58.0, lng: -45.0, count: 250, radiusDeg: 7.0 }  // 斯科舍海/南極
        ];

        const RADIUS = 100;
        let scene, camera, renderer, controls, globeGroup;
        let markerObjects = [];
        let nebulaPointsMesh, nebulaPositions, nebulaBasePositions, nebulaCount;
        let currentIndex = 0;
        let isAutoPlaying = false;
        let autoPlayTimer = null;
        let globalClock = 0;

        const container = document.getElementById('webgl-container');
        const dialogCard = document.getElementById('dialog-card');

        function latLngToVector3(lat, lng, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lng + 180) * (Math.PI / 180);
            return new THREE.Vector3(
                -radius * Math.sin(phi) * Math.cos(theta),
                radius * Math.cos(phi),
                radius * Math.sin(phi) * Math.sin(theta)
            );
        }

        // 產生柔和邊緣的發光圓點粒子紋理
        function createGlowPointTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 30);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.3, 'rgba(255, 255, 255, 0.8)');
            gradient.addColorStop(0.7, 'rgba(255, 255, 255, 0.2)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        function createTextSprite(text, isPredict) {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = isPredict ? 'rgba(234, 179, 8, 0.95)' : 'rgba(239, 68, 68, 0.95)';
            ctx.font = 'bold 22px -apple-system, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = '#000';
            ctx.shadowBlur = 4;
            ctx.fillText(text, 64, 32);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(9, 4.5, 1);
            return sprite;
        }

        async function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 30, 280);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; 
            controls.dampingFactor = 0.05;
            controls.minDistance = 120; 
            controls.maxDistance = 500;

            globeGroup = new THREE.Group();
            scene.add(globeGroup);

            // 地球本體材質
            const textureLoader = new THREE.TextureLoader();
            const earthTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
            const bumpTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-topology.png');

            const earthGeo = new THREE.SphereGeometry(RADIUS, 64, 64);
            const earthMat = new THREE.MeshPhongMaterial({ 
                map: earthTexture,
                bumpMap: bumpTexture,
                bumpScale: 1.5,
                specular: new THREE.Color('#1e293b'), 
                shininess: 15
            });
            const earthMesh = new THREE.Mesh(earthGeo, earthMat);
            globeGroup.add(earthMesh);

            // 幾何外骨骼科技線網 (圖片中的科技幾何外框)
            const wireframeGeo = new THREE.IcosahedronGeometry(RADIUS * 1.04, 3);
            const wireframeMat = new THREE.MeshBasicMaterial({
                color: 0x334155,
                wireframe: true,
                transparent: true,
                opacity: 0.18
            });
            globeGroup.add(new THREE.Mesh(wireframeGeo, wireframeMat));

            // 大氣光暈
            const atmosphereGeo = new THREE.SphereGeometry(RADIUS * 1.015, 64, 64);
            const atmosphereMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.12, side: THREE.BackSide });
            globeGroup.add(new THREE.Mesh(atmosphereGeo, atmosphereMat));

            scene.add(new THREE.AmbientLight(0xffffff, 0.9));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(200, 100, 200);
            scene.add(dirLight);

            loadTectonicPlates();
            buildSpectralNebulaPointCloud(); // 建立多光譜星雲粒子

            await refreshUSGSData();
            setInterval(refreshUSGSData, API_POLL_INTERVAL);

            window.addEventListener('resize', onWindowResize);
            focusEvent(0);
            animate();
        }

        function loadTectonicPlates() {
            fetch('https://raw.githubusercontent.com/fraxen/tectonicplates/master/GeoJSON/PB2002_boundaries.json')
                .then(res => res.json())
                .then(data => {
                    const material = new THREE.LineBasicMaterial({ color: 0x475569, transparent: true, opacity: 0.35, linewidth: 1 });
                    data.features.forEach(feature => {
                        const coords = feature.geometry.coordinates;
                        const points = [];
                        coords.forEach(coord => {
                            points.push(latLngToVector3(coord[1], coord[0], RADIUS + 0.4));
                        });
                        const geometry = new THREE.BufferGeometry().setFromPoints(points);
                        const line = new THREE.Line(geometry, material);
                        globeGroup.add(line);
                    });
                })
                .catch(err => console.log('Plate fallback:', err));
        }

        // 建立 GPU 多光譜彩色星雲點雲 (還原圖片的多色粒子團)
        function buildSpectralNebulaPointCloud() {
            let total = 0;
            stressNebulaCenters.forEach(c => total += c.count);
            nebulaCount = total;

            const positions = new Float32Array(total * 3);
            const basePositions = new Float32Array(total * 3);
            const colors = new Float32Array(total * 3);

            // 多光譜色系池：亮紫、深紅、粉橙、碧綠、亮青、藍白
            const palette = [
                new THREE.Color('#c084fc'), // 紫
                new THREE.Color('#f43f5e'), // 洋紅
                new THREE.Color('#fb923c'), // 橙
                new THREE.Color('#2dd4bf'), // 碧綠
                new THREE.Color('#38bdf8'), // 亮青
                new THREE.Color('#e0e7ff')  // 亮白
            ];

            let pIdx = 0;
            stressNebulaCenters.forEach(center => {
                for (let i = 0; i < center.count; i++) {
                    // 高斯常態分佈散佈經緯度
                    const u = Math.random();
                    const v = Math.random();
                    const r = Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
                    const angle = Math.random() * Math.PI * 2;
                    
                    const dLat = (r * Math.cos(angle)) * (center.radiusDeg * 0.4);
                    const dLng = (r * Math.sin(angle)) * (center.radiusDeg * 0.4);
                    const altitude = RADIUS + 0.5 + Math.random() * 2.5;

                    const pos = latLngToVector3(center.lat + dLat, center.lng + dLng, altitude);

                    positions[pIdx * 3] = pos.x;
                    positions[pIdx * 3 + 1] = pos.y;
                    positions[pIdx * 3 + 2] = pos.z;

                    basePositions[pIdx * 3] = pos.x;
                    basePositions[pIdx * 3 + 1] = pos.y;
                    basePositions[pIdx * 3 + 2] = pos.z;

                    // 依徑向距離混合多光譜色調
                    const col = palette[Math.floor(Math.random() * palette.length)].clone();
                    colors[pIdx * 3] = col.r;
                    colors[pIdx * 3 + 1] = col.g;
                    colors[pIdx * 3 + 2] = col.b;

                    pIdx++;
                }
            });

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 1.6,
                vertexColors: true,
                map: createGlowPointTexture(),
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.75,
                depthWrite: false
            });

            nebulaPointsMesh = new THREE.Points(geometry, material);
            nebulaPositions = positions;
            nebulaBasePositions = basePositions;
            globeGroup.add(nebulaPointsMesh);
        }

        async function refreshUSGSData() {
            try {
                const response = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_month.geojson');
                const data = await response.json();
                
                allEarthquakeData = allEarthquakeData.filter(d => !d.id.startsWith("usgs_"));

                data.features.forEach(eq => {
                    const mag = eq.properties.mag;
                    const lat = eq.geometry.coordinates[1];
                    const lng = eq.geometry.coordinates[0];
                    const depth = eq.geometry.coordinates[2];

                    if (mag >= 5.6 || (lat < -45 && mag >= 5.0)) {
                        const place = eq.properties.place;
                        const timeStr = new Date(eq.properties.time).toISOString().split('T')[0];
                        
                        allEarthquakeData.push({
                            id: "usgs_" + eq.id,
                            type: "real",
                            date: timeStr + " (USGS即時)",
                            location: place,
                            lat: lat,
                            lng: lng,
                            mag: "M " + mag.toFixed(1),
                            depth: depth.toFixed(0) + " km",
                            desc: `USGS 自動回報。震央座標 [${lat.toFixed(2)}, ${lng.toFixed(2)}]。`
                        });
                    }
                });

                document.getElementById('sync-status').innerText = `已同步 USGS 即時數據 (共 ${allEarthquakeData.length} 筆)`;
                rebuildMarkersAndControls();
            } catch (e) {
                console.log("USGS API Fallback", e);
                document.getElementById('sync-status').innerText = 'USGS 連線逾時，使用快取數據';
            }
        }

        function rebuildMarkersAndControls() {
            markerObjects.forEach(m => {
                globeGroup.remove(m.dot);
                globeGroup.remove(m.ring1);
                globeGroup.remove(m.ring2);
                globeGroup.remove(m.sprite);
            });
            markerObjects = [];

            allEarthquakeData.forEach((eq) => {
                const pos = latLngToVector3(eq.lat, eq.lng, RADIUS + 0.8);
                const isPredict = eq.type === 'predict';
                const color = isPredict ? 0xeab308 : 0xef4444;

                const dotGeo = new THREE.SphereGeometry(0.7, 12, 12);
                const dotMat = new THREE.MeshBasicMaterial({ color: color });
                const dotMesh = new THREE.Mesh(dotGeo, dotMat);
                dotMesh.position.copy(pos);

                const ringGeo = new THREE.RingGeometry(1.2, 1.45, 32);
                const ringMat1 = new THREE.MeshBasicMaterial({ color: color, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
                const ringMesh1 = new THREE.Mesh(ringGeo, ringMat1);
                ringMesh1.position.copy(pos);
                ringMesh1.lookAt(new THREE.Vector3(0, 0, 0));

                const ringMat2 = new THREE.MeshBasicMaterial({ color: color, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
                const ringMesh2 = new THREE.Mesh(ringGeo.clone(), ringMat2);
                ringMesh2.position.copy(pos);
                ringMesh2.lookAt(new THREE.Vector3(0, 0, 0));

                const sprite = createTextSprite(eq.mag, isPredict);
                const textPos = latLngToVector3(eq.lat, eq.lng, RADIUS + 4.2);
                sprite.position.copy(textPos);

                globeGroup.add(dotMesh);
                globeGroup.add(ringMesh1);
                globeGroup.add(ringMesh2);
                globeGroup.add(sprite);

                markerObjects.push({
                    dot: dotMesh,
                    ring1: ringMesh1,
                    ring2: ringMesh2,
                    sprite: sprite,
                    pos: pos,
                    data: eq,
                    scale1: 1.0,
                    scale2: 2.4
                });
            });

            const bar = document.getElementById('timeline-controls');
            bar.innerHTML = '<button class="btn-step" id="btn-auto">自動導覽</button>';
            const autoBtn = document.getElementById('btn-auto');

            allEarthquakeData.forEach((eq, idx) => {
                const btn = document.createElement('button');
                btn.className = `btn-step ${eq.type === 'predict' ? 'predict-btn' : ''}`;
                btn.id = `btn-step-${idx}`;
                const shortName = eq.location.split(',')[0].split(' of ')[1] || eq.location.split(' ')[0];
                btn.innerText = `${idx + 1}. ${eq.type === 'predict' ? '[預測]' : ''}${shortName}`;
                btn.onclick = () => { stopAutoPlay(); focusEvent(idx); };
                bar.insertBefore(btn, autoBtn);
            });

            autoBtn.onclick = () => {
                if (isAutoPlaying) { stopAutoPlay(); } else { startAutoPlay(); }
            };
        }

        function focusEvent(index) {
            if (!markerObjects[index]) return;
            currentIndex = index;
            const target = markerObjects[index];

            document.querySelectorAll('.btn-step').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-step-${index}`);
            if (activeBtn) activeBtn.classList.add('active');

            targetRotationY = -target.data.lng * (Math.PI / 180) - (Math.PI / 2);
            targetRotationX = target.data.lat * (Math.PI / 180);

            const badge = document.getElementById('c-badge');
            if (target.data.type === 'predict') {
                badge.className = 'badge-type predict';
                badge.innerText = '科學預測高風險區';
            } else {
                badge.className = 'badge-type real';
                badge.innerText = '實際發生地震';
            }

            document.getElementById('c-title').innerText = target.data.location;
            document.getElementById('c-date').innerText = target.data.date;
            document.getElementById('c-mag').innerText = target.data.mag;
            document.getElementById('c-depth').innerText = `深度 ${target.data.depth}`;
            document.getElementById('c-desc').innerText = target.data.desc;

            dialogCard.style.display = 'block';
            dialogCard.style.opacity = '1';
        }

        let targetRotationY = 0;
        let targetRotationX = 0;

        function startAutoPlay() {
            isAutoPlaying = true;
            document.getElementById('btn-auto').innerText = '暫停導覽';
            document.getElementById('btn-auto').classList.add('active');
            clearInterval(autoPlayTimer);
            autoPlayTimer = setInterval(() => {
                currentIndex = (currentIndex + 1) % allEarthquakeData.length;
                focusEvent(currentIndex);
            }, 5000);
        }

        function stopAutoPlay() {
            isAutoPlaying = false;
            document.getElementById('btn-auto').innerText = '自動導覽';
            document.getElementById('btn-auto').classList.remove('active');
            clearInterval(autoPlayTimer);
        }

        function updateDialogPosition() {
            if (markerObjects.length === 0 || !markerObjects[currentIndex]) return;
            const currentMarker = markerObjects[currentIndex];
            const worldPos = currentMarker.pos.clone().applyMatrix4(globeGroup.matrixWorld);
            const screenPos = worldPos.project(camera);
            const x = (screenPos.x * .5 + .5) * window.innerWidth;
            const y = (-(screenPos.y * .5) + .5) * window.innerHeight;

            if (screenPos.z < 0.98) {
                dialogCard.style.display = 'block';
                dialogCard.style.left = `${x - 160}px`;
                dialogCard.style.top = `${y - 180}px`;
            } else {
                dialogCard.style.display = 'none';
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            globalClock += 0.03;

            globeGroup.rotation.y += (targetRotationY - globeGroup.rotation.y) * 0.04;
            globeGroup.rotation.x += (targetRotationX - globeGroup.rotation.x) * 0.04;

            // 地震中空環擴張 (速度降低 50%：0.01)
            markerObjects.forEach(m => {
                m.scale1 += 0.01;
                if (m.scale1 > 3.8) m.scale1 = 1.0;
                m.ring1.scale.set(m.scale1, m.scale1, 1);
                m.ring1.material.opacity = Math.max(0, (3.8 - m.scale1) / 2.8);

                m.scale2 += 0.01;
                if (m.scale2 > 3.8) m.scale2 = 1.0;
                m.ring2.scale.set(m.scale2, m.scale2, 1);
                m.ring2.material.opacity = Math.max(0, (3.8 - m.scale2) / 2.8);
            });

            // 多光譜星雲粒子呼吸膨脹與三維擾動 (動態微流動)
            if (nebulaPointsMesh && nebulaPositions) {
                for (let i = 0; i < nebulaCount; i++) {
                    const i3 = i * 3;
                    const bx = nebulaBasePositions[i3];
                    const by = nebulaBasePositions[i3 + 1];
                    const bz = nebulaBasePositions[i3 + 2];

                    // 三維正弦擾動，營造星雲呼吸與微渦流
                    const noise = Math.sin(globalClock * 1.5 + i * 0.1) * 0.4;
                    nebulaPositions[i3] = bx + (bx / RADIUS) * noise;
                    nebulaPositions[i3 + 1] = by + (by / RADIUS) * noise;
                    nebulaPositions[i3 + 2] = bz + (bz / RADIUS) * noise;
                }
                nebulaPointsMesh.geometry.attributes.position.needsUpdate = true;
            }

            controls.update();
            updateDialogPosition();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
