<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球板塊動態與即時地震監測系統 (USGS API)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #030712; 
            color: #f3f4f6; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            overflow: hidden; 
        }
        #webgl-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* 頂部標題 */
        .header {
            position: absolute;
            top: 24px;
            left: 28px;
            z-index: 10;
            pointer-events: none;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #38bdf8;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }
        .header p {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }

        /* 圖例說明面板 */
        .legend-panel {
            position: absolute;
            top: 24px;
            right: 28px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.3);
            backdrop-filter: blur(8px);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 12px;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .legend-item:last-child { margin-bottom: 0; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot.real { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
        .dot.predict { background: #eab308; box-shadow: 0 0 8px #eab308; }
        .dot.flow { background: #38bdf8; box-shadow: 0 0 8px #38bdf8; }

        /* 浮動對話框 (Info Card) */
        #dialog-card {
            position: absolute;
            z-index: 20;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 16px 20px;
            width: 320px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
            display: none;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .badge-type {
            font-size: 10px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 6px;
        }
        .badge-type.real { background: #ef4444; color: #fff; }
        .badge-type.predict { background: #eab308; color: #0f172a; }

        .card-title { font-size: 15px; font-weight: bold; color: #fff; margin-bottom: 6px; }
        .card-meta { font-size: 12px; color: #38bdf8; margin-bottom: 6px; display: flex; gap: 10px; flex-wrap: wrap; }
        .card-desc { font-size: 11px; color: #cbd5e1; line-height: 1.4; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 6px; }

        /* 底部控制列 */
        .timeline-bar {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 90vw;
            overflow-x: auto;
        }
        .btn-step {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 11px;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .btn-step:hover { background: #38bdf8; color: #0f172a; font-weight: bold; }
        .btn-step.active { background: #f97316; border-color: #f97316; color: #fff; font-weight: bold; }
        .btn-step.predict-btn { border-color: #eab308; color: #eab308; }
        .btn-step.predict-btn.active { background: #eab308; color: #0f172a; }
    </style>
</head>
<body>

    <div class="header">
        <h1>全球板塊動態與即時地震監測</h1>
        <p>整合 USGS 即時 API 數據、板塊流光向量與科學預測風險區</p>
    </div>

    <!-- 圖例說明 -->
    <div class="legend-panel">
        <div class="legend-item"><div class="dot real"></div><span>實際發生地震 (含 USGS 即時資料)</span></div>
        <div class="legend-item"><div class="dot predict"></div><span>科學預測高風險區 / 應力窗</span></div>
        <div class="legend-item"><div class="dot flow"></div><span>板塊擠壓與運動流光向量</span></div>
    </div>

    <!-- 彈出對話框 -->
    <div id="dialog-card">
        <span class="badge-type real" id="c-badge">實際發生</span>
        <div class="card-title" id="c-title">載入中...</div>
        <div class="card-meta">
            <span id="c-date">--</span>
            <span id="c-mag">--</span>
            <span id="c-depth">--</span>
        </div>
        <div class="card-desc" id="c-desc">--</div>
    </div>

    <!-- 底部控制列 -->
    <div class="timeline-bar" id="timeline-controls">
        <button class="btn-step" id="btn-auto">自動導覽</button>
    </div>

    <div id="webgl-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 核心資料集：包含歷史/重大事件 + 科學預測區 + 即時API資料容器
        let allEarthquakeData = [
            // --- 科學預測高風險區 (以黃色標記與預測模型區分) ---
            {
                id: "p1", type: "predict",
                date: "預測視窗：2026 Q3-Q4",
                location: "台灣東部海域外海 (琉球海溝延續段)",
                lat: 23.8, lng: 122.5,
                mag: "評估 M 7.0+", depth: "15-30 km",
                tectonic: "逆衝型潛在應力窗",
                desc: "依據菲律賓海板塊向北持續擠壓歐亞板塊之 GPS 形變速率與歷史空區模型，此區塊能量累積顯著。"
            },
            {
                id: "p2", type: "predict",
                date: "預測視窗：2026 下半年",
                location: "南美洲 中段隱沒帶 (祕魯/智利交界)",
                lat: -18.5, lng: -70.3,
                mag: "評估 M 7.5+", depth: "35 km",
                tectonic: "納斯卡板塊隱沒鎖定區",
                desc: "柏感受到震源區滑動赤字（Seismic Gap）影響，顯示未來數月具備顯著逆衝破裂潛勢。"
            },
            // --- 歷史與重大實際發生事件 ---
            {
                id: "r1", type: "real",
                date: "2026/08/14",
                location: "印尼 弗洛勒斯海",
                lat: -7.60, lng: 121.90,
                mag: "M 7.7", depth: "10 km",
                tectonic: "逆斷層 / 走滑",
                desc: "弗洛勒斯逆衝帶淺層破裂，澳洲板塊朝巽他板塊隱沒前緣擠壓。"
            },
            {
                id: "r2", type: "real",
                date: "2026/08/10",
                location: "哥倫比亞 喬科省",
                lat: 4.90, lng: -76.60,
                mag: "M 7.4", depth: "110 km",
                tectonic: "板塊內正斷層",
                desc: "納斯卡板塊俯衝至南美板塊下方的中深層板塊拉張撕裂。"
            },
            {
                id: "r3", type: "real",
                date: "2026/06/07",
                location: "菲律賓 棉蘭老島西南外海",
                lat: 5.92, lng: 124.95,
                mag: "M 7.8", depth: "57 km",
                tectonic: "斜移 / 逆斷層",
                desc: "哥塔巴托海溝隱沒帶與菲律賓移動帶板塊交界面強烈擠壓。"
            }
        ];

        const RADIUS = 100;
        let scene, camera, renderer, controls, globeGroup;
        let markers = [];
        let flowParticles = [];
        let currentIndex = 0;
        let isAutoPlaying = false;
        let autoPlayTimer = null;

        const container = document.getElementById('webgl-container');
        const dialogCard = document.getElementById('dialog-card');

        function latLngToVector3(lat, lng, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lng + 180) * (Math.PI / 180);
            return new THREE.Vector3(
                -radius * Math.sin(phi) * Math.cos(theta),
                radius * Math.cos(phi),
                radius * Math.sin(phi) * Math.sin(theta)
            );
        }

        // 建立帶有大陸輪廓與板塊縫隙的地球材質
        function createEarthTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#061325'; ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 經緯網格
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.06)'; ctx.lineWidth = 1;
            for (let x = 0; x <= canvas.width; x += 64) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
            for (let y = 0; y <= canvas.height; y += 64) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

            // 大陸色塊
            ctx.fillStyle = '#0f2942';
            ctx.beginPath(); ctx.ellipse(450, 400, 180, 240, 0, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(580, 700, 140, 200, 0.3, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(1200, 320, 260, 160, 0, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(1150, 600, 160, 200, 0, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(1650, 380, 200, 160, 0, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(1700, 750, 140, 120, 0, 0, Math.PI * 2); ctx.fill();

            // 板塊接縫線
            ctx.strokeStyle = '#f97316'; ctx.lineWidth = 3; ctx.shadowColor = '#ea580c'; ctx.shadowBlur = 8;
            ctx.beginPath(); ctx.moveTo(350, 100); ctx.bezierCurveTo(280, 300, 350, 600, 520, 950); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(1800, 100); ctx.bezierCurveTo(1600, 300, 1550, 650, 1850, 950); ctx.stroke();

            return new THREE.CanvasTexture(canvas);
        }

        async function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 40, 280);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.dampingFactor = 0.05;
            controls.minDistance = 140; controls.maxDistance = 500;

            globeGroup = new THREE.Group();
            scene.add(globeGroup);

            // 球體與大氣層
            const earthGeo = new THREE.SphereGeometry(RADIUS, 64, 64);
            const earthMat = new THREE.MeshPhongMaterial({ map: createEarthTexture(), specular: new THREE.Color('#1e293b'), shininess: 10, emissive: new THREE.Color('#020617') });
            globeGroup.add(new THREE.Mesh(earthGeo, earthMat));

            const atmosphereGeo = new THREE.SphereGeometry(RADIUS * 1.02, 64, 64);
            const atmosphereMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.1, side: THREE.BackSide });
            globeGroup.add(new THREE.Mesh(atmosphereGeo, atmosphereMat));

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(200, 100, 200);
            scene.add(dirLight);

            // **非同步抓取 USGS 即時 API 資料**
            await fetchUSGSData();

            // 建立 3D 標記與板塊流光特效
            buildMarkers();
            buildTectonicFlows();
            buildControls();

            window.addEventListener('resize', onWindowResize);
            focusEvent(0);
            animate();
        }

        // 串接 USGS 即時 API (抓取近30天 M4.5 以上地震，並過濾出重大 M6.5+ 整合進來)
        async function fetchUSGSData() {
            try {
                const response = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_month.geojson');
                const data = await response.json();
                
                // 取出規模大於 6.8 的重大即時地震加入清單中
                let addedCount = 0;
                data.features.forEach(eq => {
                    const mag = eq.properties.mag;
                    if (mag >= 6.8 && addedCount < 5) { // 限制最多抓取 5 筆重大即時地震
                        const coords = eq.geometry.coordinates; // [lng, lat, depth]
                        const place = eq.properties.place;
                        const timeStr = new Date(eq.properties.time).toISOString().split('T')[0];
                        
                        // 避免重複加入
                        allEarthquakeData.push({
                            id: "usgs_" + eq.id,
                            type: "real",
                            date: timeStr + " (USGS即時)",
                            location: place,
                            lat: coords[1],
                            lng: coords[0],
                            mag: "M " + mag.toFixed(1),
                            depth: coords[2].toFixed(0) + " km",
                            tectonic: "板塊活動即時監測",
                            desc: "由美國地質調查局 (USGS) 即時資料庫自動回報之顯著地震事件。"
                        });
                        addedCount++;
                    }
                });
            } catch (e) {
                console.log("USGS API 載入失敗，使用預設與歷史資料庫運作。", e);
            }
        }

        function buildMarkers() {
            allEarthquakeData.forEach((eq, idx) => {
                const pos = latLngToVector3(eq.lat, eq.lng, RADIUS + 1.2);
                
                const color = eq.type === 'real' ? 0xef4444 : 0xeab308;
                const markerGeo = new THREE.SphereGeometry(eq.type === 'real' ? 2.5 : 3, 16, 16);
                const markerMat = new THREE.MeshBasicMaterial({ color: color });
                const markerMesh = new THREE.Mesh(markerGeo, markerMat);
                markerMesh.position.copy(pos);

                // 外擴脈衝環
                const ringGeo = new THREE.RingGeometry(2, eq.type === 'real' ? 5 : 7, 32);
                const ringMat = new THREE.MeshBasicMaterial({ color: color, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
                const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                ringMesh.position.copy(pos);
                ringMesh.lookAt(new THREE.Vector3(0, 0, 0));

                globeGroup.add(markerMesh);
                globeGroup.add(ringMesh);

                markers.push({ mesh: markerMesh, ring: ringMesh, pos: pos, data: eq, scale: 1 });
            });
        }

        // 建立板塊運動方向的動態流光特效（環太平洋與大西洋區）
        function buildTectonicFlows() {
            // 模擬環太平洋隱沒帶的流光軌跡點群
            const curvePoints = [
                latLngToVector3(50, 150, RADIUS + 1.5),
                latLngToVector3(35, 140, RADIUS + 1.5),
                latLngToVector3(15, 130, RADIUS + 1.5),
                latLngToVector3(-5, 125, RADIUS + 1.5)
            ];
            const curve = new THREE.CatmullRomCurve3(curvePoints);
            const tubeGeo = new THREE.TubeGeometry(curve, 64, 0.6, 8, false);
            const tubeMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.25 });
            globeGroup.add(new THREE.Mesh(tubeGeo, tubeMat));

            // 在軌道上增加動態流光粒子
            for (let i = 0; i < 5; i++) {
                const pGeo = new THREE.SphereGeometry(1.2, 8, 8);
                const pMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
                const particle = new THREE.Mesh(pGeo, pMat);
                globeGroup.add(particle);
                flowParticles.push({ mesh: particle, curve: curve, progress: i / 5 });
            }
        }

        function buildControls() {
            const bar = document.getElementById('timeline-controls');
            const autoBtn = document.getElementById('btn-auto');

            allEarthquakeData.forEach((eq, idx) => {
                const btn = document.createElement('button');
                btn.className = `btn-step ${eq.type === 'predict' ? 'predict-btn' : ''}`;
                btn.id = `btn-step-${idx}`;
                const shortName = eq.location.split(' ')[0];
                btn.innerText = `${idx + 1}. ${eq.type === 'predict' ? '[預測]' : ''}${shortName}`;
                btn.onclick = () => { stopAutoPlay(); focusEvent(idx); };
                bar.insertBefore(btn, autoBtn);
            });

            autoBtn.onclick = () => {
                if (isAutoPlaying) { stopAutoPlay(); } else { startAutoPlay(); }
            };
        }

        function focusEvent(index) {
            currentIndex = index;
            const target = markers[index];

            document.querySelectorAll('.btn-step').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-step-${index}`);
            if (activeBtn) activeBtn.classList.add('active');

            targetRotationY = -target.data.lng * (Math.PI / 180) - (Math.PI / 2);
            targetRotationX = target.data.lat * (Math.PI / 180);

            const badge = document.getElementById('c-badge');
            if (target.data.type === 'predict') {
                badge.className = 'badge-type predict';
                badge.innerText = '科學預測高風險區';
            } else {
                badge.className = 'badge-type real';
                badge.innerText = '實際發生地震';
            }

            document.getElementById('c-title').innerText = target.data.location;
            document.getElementById('c-date').innerText = target.data.date;
            document.getElementById('c-mag').innerText = target.data.mag;
            document.getElementById('c-depth').innerText = `深度 ${target.data.depth}`;
            document.getElementById('c-desc').innerText = target.data.desc;

            dialogCard.style.display = 'block';
            dialogCard.style.opacity = '1';
        }

        let targetRotationY = 0;
        let targetRotationX = 0;

        function startAutoPlay() {
            isAutoPlaying = true;
            document.getElementById('btn-auto').innerText = '暫停導覽';
            document.getElementById('btn-auto').classList.add('active');
            clearInterval(autoPlayTimer);
            autoPlayTimer = setInterval(() => {
                currentIndex = (currentIndex + 1) % allEarthquakeData.length;
                focusEvent(currentIndex);
            }, 5000);
        }

        function stopAutoPlay() {
            isAutoPlaying = false;
            document.getElementById('btn-auto').innerText = '自動導覽';
            document.getElementById('btn-auto').classList.remove('active');
            clearInterval(autoPlayTimer);
        }

        function updateDialogPosition() {
            if (markers.length === 0) return;
            const currentMarker = markers[currentIndex];
            const worldPos = currentMarker.pos.clone().applyMatrix4(globeGroup.matrixWorld);
            const screenPos = worldPos.project(camera);
            const x = (screenPos.x * .5 + .5) * window.innerWidth;
            const y = (-(screenPos.y * .5) + .5) * window.innerHeight;

            if (screenPos.z < 0.98) {
                dialogCard.style.display = 'block';
                dialogCard.style.left = `${x - 160}px`;
                dialogCard.style.top = `${y - 180}px`;
            } else {
                dialogCard.style.display = 'none';
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            globeGroup.rotation.y += (targetRotationY - globeGroup.rotation.y) * 0.04;
            globeGroup.rotation.x += (targetRotationX - globeGroup.rotation.x) * 0.04;

            // 脈衝動畫
            markers.forEach(m => {
                m.scale += 0.02;
                if (m.scale > 2.5) m.scale = 1;
                m.ring.scale.set(m.scale, m.scale, 1);
                m.ring.material.opacity = (2.5 - m.scale) / 1.5;
            });

            // 板塊流光動畫
            flowParticles.forEach(fp => {
                fp.progress += 0.003;
                if (fp.progress > 1) fp.progress = 0;
                const pt = fp.curve.getPoint(fp.progress);
                fp.mesh.position.copy(pt);
            });

            controls.update();
            updateDialogPosition();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
